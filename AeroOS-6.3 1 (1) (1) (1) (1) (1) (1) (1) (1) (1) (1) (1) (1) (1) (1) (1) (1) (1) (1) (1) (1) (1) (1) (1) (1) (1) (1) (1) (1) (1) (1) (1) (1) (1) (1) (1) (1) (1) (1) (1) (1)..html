    if(/\b(style|css|background|color|farbe|dunkel|dark|hell|light|bunt|theme|font|größ|size|breit|hoch|width|height|margin|padding|border|shadow|opacity|gradient|design|aussehen|layout|anzeig|rund|eckig|animat|minimalist|retro|sieht\s*aus)\b/.test(t)) return 'purple';
    if(/\b(click|onclick|wenn\b|if\b|else\b|for\b|while\b|foreach|loop|schleif|zähl|count|async|await|fetch|post|get|submit|event|trigger|function|def\b|update|render|refresh|show|display|schreib|delet|add|entfern|remov|speich|save|lade|start|stop|pause|reset|toggle|check|send|receive|listen|berechne|calc|sum|sort|filter|map|reduc|öffn|schließ|close)\b|=>|->/.test(t)) return 'green';
    if(/\b(window|fenster|button|btn|input|textarea|checkbox|select|dropdown|liste?|tabelle|table|grid|form|modal|dialog|popup|sidebar|header|footer|nav|menu|toolbar|panel|card|container|app\b|label|titel|title|icon|bild|image|img\b|canvas|anzeige|textfeld|feld)\b|^<[a-z]/.test(t)) return 'blue';
    return null;
  },

  _neuroHL(code){
    const C={blue:'#4488ff',green:'#44cc88',yellow:'#c8aa44',purple:'#aa66cc',gray:'#3a5060',red:'#cc5544'};
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let r='',i=0,L=code.length;
    while(i<L){
      // 1. Strings ZUERST – sonst wird https:// als Kommentar gefärbt
      if(code[i]==='"'||code[i]==="'"){
        const q=code[i];let j=i+1;
        while(j<L&&code[j]!==q&&code[j]!=='\n'){if(code[j]==='\\')j++;j++;}
        if(j<L&&code[j]===q)j++;
        r+=`<span style="color:#88cc66">${esc(code.slice(i,j))}</span>`;i=j;continue;
      }
      if(code[i]==='`'){
        let j=i+1,depth=0;
        while(j<L){
          if(code[j]==='\\'){j+=2;continue;}
          if(code[j]==='$'&&code[j+1]==='{'){depth++;j+=2;continue;}
          if(code[j]==='}'&&depth>0){depth--;j++;continue;}
          if(code[j]==='`'&&depth===0){j++;break;}
          j++;
        }
        r+=`<span style="color:#88cc66">${esc(code.slice(i,j))}</span>`;i=j;continue;
      }
      // 2. HTML-Kommentar
      if(code.startsWith('<!--',i)){let e=code.indexOf('-->',i+4);if(e===-1)e=L;else e+=3;r+=`<span style="color:#2a4a60;font-style:italic">${esc(code.slice(i,e))}</span>`;i=e;continue;}
      // 3. // Kommentar – NICHT bei https:// oder http://
      if(code[i]==='/'&&code[i+1]==='/'){
        if(i>0&&code[i-1]===':'){r+=esc('/');i++;continue;}
        let e=code.indexOf('\n',i);if(e===-1)e=L;
        r+=`<span style="color:#2a4a60;font-style:italic">${esc(code.slice(i,e))}</span>`;i=e;continue;
      }
      // 4. /* */ Blockkommentar
      if(code[i]==='/'&&code[i+1]==='*'){let e=code.indexOf('*/',i+2);if(e===-1)e=L;else e+=2;r+=`<span style="color:#2a4a60;font-style:italic">${esc(code.slice(i,e))}</span>`;i=e;continue;}
      // 5. XML/HTML-Tag komplett einfärben
      if(code[i]==='<'&&i+1<L&&/[a-zA-Z\/!]/.test(code[i+1])){let j=i;while(j<L&&code[j]!=='>'&&code[j]!=='\n')j++;if(j<L&&code[j]==='>') j++;r+=`<span style="color:${C.blue}">${esc(code.slice(i,j))}</span>`;i=j;continue;}
      // 6. Wörter
      if(/[a-zA-ZäöüÄÖÜß_]/.test(code[i])){let j=i;while(j<L&&/[a-zA-ZäöüÄÖÜß0-9_]/.test(code[j]))j++;const w=code.slice(i,j);const cl=this._neuroColor(w);r+=cl?`<span style="color:${C[cl]}">${esc(w)}</span>`:esc(w);i=j;continue;}
      // 7. Pfade /home/...
      if(code[i]==='/'&&i+1<L&&/[a-zA-Z]/.test(code[i+1])){let j=i;while(j<L&&/[a-zA-Z0-9_\-\/\.]/.test(code[j]))j++;r+=`<span style="color:${C.yellow}">${esc(code.slice(i,j))}</span>`;i=j;continue;}
      // 8. Hex-Farben #fff
      if(code[i]==='#'&&i+1<L&&/[0-9a-fA-F]/.test(code[i+1])){let j=i+1;while(j<L&&/[0-9a-fA-F]/.test(code[j]))j++;r+=`<span style="color:#c88844">${esc(code.slice(i,j))}</span>`;i=j;continue;}
      // 9. Zahlen inkl. CSS-Einheiten
      if(/[0-9]/.test(code[i])){let j=i;while(j<L&&/[0-9\.]/.test(code[j]))j++;if(j<L&&/[a-zA-Z%]/.test(code[j])){while(j<L&&/[a-zA-Z0-9%]/.test(code[j]))j++;}r+=`<span style="color:#c88844">${esc(code.slice(i,j))}</span>`;i=j;continue;}
      // 10. Operatoren
      if(/[=><!+\-*\/%&|^~?:;,.]/.test(code[i])){r+=`<span style="color:#3a5870">${esc(code[i])}</span>`;i++;continue;}
      r+=esc(code[i]);i++;
    }
    return r;
  },

  _syncHL(id){
    const ta=document.getElementById('kai-ta-'+id);const pre=document.getElementById('kai-pre-'+id);
    if(!ta||!pre)return;
    pre.innerHTML=this._neuroHL(ta.value)+'\n';
    pre.scrollTop=ta.scrollTop;
  },

  _hlT:{},_schedHL(id){clearTimeout(this._hlT[id]);this._hlT[id]=setTimeout(()=>this._syncHL(id),60);},

  _acT:{},_schedAC(id){clearTimeout(this._acT[id]);this._acT[id]=setTimeout(()=>this._doAC(id),1400);},

  async _doAC(id){
    const d=WM.getData(id);if(!d||d.compiling)return;
    const ta=document.getElementById('kai-ta-'+id);if(!ta)return;
    const text=ta.value;if(!text||text.length<20)return;
    const key=localStorage.getItem('aeroos_claude_key')||'';if(!key)return;
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:60,system:'Du bist Neuro AutoComplete für KompAI. Vervollständige den letzten Gedanken des Nutzers in max 1 Satz auf Deutsch. Nur die Fortsetzung, keine Erklärung.',messages:[{role:'user',content:text.slice(-250)}]})});
      if(!resp.ok)return;
      const data=await resp.json();
      const suggestion=(data.content?.[0]?.text||'').trim();
      if(!suggestion)return;
      const acEl=document.getElementById('kai-ac-'+id);const acTx=document.getElementById('kai-ac-text-'+id);
      if(acEl&&acTx&&WM.getData(id)){WM.getData(id).acSuggestion=suggestion;acTx.textContent=suggestion;acEl.style.display='block';}
    }catch(e){}
  },

  async compile(id){
    const d=WM.getData(id);if(!d||d.compiling)return;
    const key=localStorage.getItem('aeroos_claude_key')||'';
    if(!key){OS.notify('🔑','API-Schlüssel fehlt','Öffne Claude AI und speichere deinen Key');return;}
    const ta=document.getElementById('kai-ta-'+id);
    const code=(ta?.value||'').trim();if(!code){OS.notify('⚡','Kein Code','Schreib zuerst etwas');return;}
    const nameEl=document.getElementById('kai-name-'+id);
    const appName=((nameEl?.value||'meine-app').trim()||'meine-app').replace(/[^a-z0-9\-_]/gi,'-').toLowerCase();
    d.compiling=true;
    const btn=document.getElementById('kai-compile-'+id);
    const statusEl=document.getElementById('kai-status-'+id);
    const outEl=document.getElementById('kai-out-'+id);
    if(btn){btn.textContent='⏳ Kompiliert…';btn.style.background='linear-gradient(135deg,#608080,#304040)';}
    if(statusEl)statusEl.textContent='KI interpretiert…';
    outEl.innerHTML=`<div style="padding:30px;text-align:center;color:#4a7090"><div style="font-size:22px;margin-bottom:10px;display:inline-block;animation:spin 1s linear infinite">⚡</div><div style="font-size:12px;margin-top:8px;color:#2a5060">KompAI kompiliert…<br><span style="font-size:10px;color:#1a3040">Die KI interpretiert deine Absicht</span></div></div>`;
    const SYSTEM=`Du bist der KompAI-Compiler für AeroOS 6.2.
Der Nutzer schreibt in völlig freiem Format – beliebige Syntax, beliebige Sprache, Prosa, Pseudocode, Sprachgemisch. Interpretiere die Absicht und generiere korrekten AeroOS-Applikationscode.

Globale AeroOS-Objekte:
  WM.open({ id, title, icon, w, h, html(id), init(id) })
  VFS.read(path) → string|null
  VFS.write(path, content) → boolean
  VFS.list(path) → [{name,type,content}]|null
  OS.notify(icon, title, msg)

Ausgabe-Regeln (STRIKT):
- Gib AUSSCHLIESSLICH JavaScript-Code zurück. Kein Markdown, keine Erklärungen, keine Backticks.
- Der Code öffnet eine App via WM.open({...})
- html(id) gibt einen HTML-String zurück inkl. <style>. Alle DOM-IDs enden auf \`-\${id}\` (Template-Literal-Syntax)
- init(id) bindet Events: document.getElementById('xyz-'+id).onclick = ...
- Design: dunkles modernes Theme, passend zu AeroOS (dunkle Hintergründe, helle Akzente)
- Undefinierte Konstrukte (bitte(), mach.was.sinnvolles(), render(), starten()) sinnvoll interpretieren oder ignorieren
- Bei Prosa-Input: vollständige funktionierende App bauen die genau das tut was beschrieben
- Mach eine echte, vollständige, interaktive App`;
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2500,system:SYSTEM,messages:[{role:'user',content:code}]})});
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e?.error?.message||'HTTP '+resp.status);}
      const data=await resp.json();
      let generated=(data.content?.[0]?.text||'').trim();
      // Strip markdown fences
      generated=generated.replace(/^```[a-z]*\s*/i,'').replace(/\s*```$/,'').trim();
      // Safety checks
      const DANGEROUS=[/while\s*\(\s*true\s*\)/g,/for\s*\(\s*;\s*;\s*\)/g,/VFS\.rm\s*\(\s*['"]\/['"]\s*\)/g,/document\.cookie/g,/fetch\s*\([^)]*(?!anthropic)[^)]*\)/g];
      for(const rx of DANGEROUS)generated=generated.replace(rx,'/* [KompAI-Safety] */');
      // Save to VFS
      if(!VFS.exists('/projekte'))VFS.mkdir('/projekte');
      const projPath='/projekte/'+appName;
      if(!VFS.exists(projPath))VFS.mkdir(projPath);
      VFS.write(projPath+'/'+appName+'.kompai',code);
      const builds=(VFS.list(projPath)||[]).filter(f=>f.name.startsWith('build-'));
      const num=String(builds.length+1).padStart(3,'0');
      const buildPath=projPath+'/build-'+num+'.js';
      VFS.write(buildPath,generated);
      d.lastBuild=generated;d.lastBuildPath=buildPath;
      // Update UI
      this._refreshBuilds(id,appName);
      const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      outEl.innerHTML=`<div style="padding:5px 10px;background:rgba(60,180,80,.08);border-bottom:1px solid rgba(60,180,80,.15);display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span style="color:#44cc66;font-size:12px">✓</span>
        <span style="font-size:11px;color:#44cc66;font-weight:700">Kompiliert — build-${num}.js</span>
        <span style="font-size:10px;color:#2a6040;margin-left:auto">${generated.split('\n').length} Zeilen · ${buildPath}</span>
      </div>
      <pre style="font:11px/1.6 Consolas,monospace;color:#4a8090;white-space:pre-wrap;word-break:break-word;padding:8px 12px;margin:0;overflow:hidden;flex:1">${esc(generated)}</pre>`;
      const runBtn=document.getElementById('kai-run-'+id);if(runBtn)runBtn.style.display='';
      if(statusEl)statusEl.textContent=`Build #${num} ✓`;
      OS.notify('⚡','KompAI',`Kompiliert! build-${num}.js gespeichert`);
    }catch(err){
      outEl.innerHTML=`<div style="padding:16px;color:#ff8888"><div style="font-weight:700;margin-bottom:6px">⚠️ Kompilierungsfehler</div><div style="font-size:11px;-webkit-user-select:text;user-select:text">${err.message}</div></div>`;
      if(statusEl)statusEl.textContent='Fehler ✗';
      if(err.message.includes('401'))OS.notify('🔑','Ungültiger API-Schlüssel','Öffne Claude AI → 🔑 und aktualisiere deinen Key');
    }finally{
      d.compiling=false;
      if(btn){btn.textContent='▶ Kompilieren';btn.style.background='linear-gradient(135deg,#3a9de0,#1a60c0)';}
    }
  },

  runBuild(id){
    const d=WM.getData(id);if(!d?.lastBuild)return;
    try{const fn=new Function('WM','VFS','OS',d.lastBuild);fn(WM,VFS,OS);}
    catch(err){OS.notify('⚠️','Laufzeitfehler',err.message.slice(0,100));}
  },

  loadBuild(id,buildPath){
    if(!buildPath)return;
    const code=VFS.read(buildPath);if(!code)return;
    const d=WM.getData(id);if(d){d.lastBuild=code;d.lastBuildPath=buildPath;}
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const outEl=document.getElementById('kai-out-'+id);
    if(outEl)outEl.innerHTML=`<div style="padding:4px 10px;font-size:10px;color:#4080a0;border-bottom:1px solid #1a2a40;background:#0d1828">${buildPath}</div><pre style="font:11px/1.6 Consolas,monospace;color:#4a8090;white-space:pre-wrap;word-break:break-word;padding:8px 12px;margin:0">${esc(code)}</pre>`;
    const runBtn=document.getElementById('kai-run-'+id);if(runBtn)runBtn.style.display='';
  },

  _refreshBuilds(id,appName){
    const sel=document.getElementById('kai-builds-'+id);if(!sel)return;
    const projPath='/projekte/'+appName;
    const builds=(VFS.list(projPath)||[]).filter(f=>f.name.startsWith('build-'));
    if(builds.length>0){
      sel.style.display='';
      sel.innerHTML='<option value="">— Build —</option>'+builds.map(f=>`<option value="${projPath}/${f.name}">${f.name}</option>`).join('');
    }
  },

  loadDemo(id,which){
    const ta=document.getElementById('kai-ta-'+id);if(!ta)return;
    ta.value=this._demos[which]||'';
    this._syncHL(id);
    const nameEl=document.getElementById('kai-name-'+id);
    if(nameEl)nameEl.value=which==='todo'?'todo-prosa':which==='timer'?'timer-xml':'datei-chaos';
    // Hide autocomplete
    const acEl=document.getElementById('kai-ac-'+id);if(acEl)acEl.style.display='none';
    ta.focus();
  },

  saveSource(id){
    const ta=document.getElementById('kai-ta-'+id);if(!ta)return;
    const nameEl=document.getElementById('kai-name-'+id);
    const appName=((nameEl?.value||'meine-app').trim()||'meine-app').replace(/[^a-z0-9\-_]/gi,'-').toLowerCase();
    if(!VFS.exists('/projekte'))VFS.mkdir('/projekte');
    const projPath='/projekte/'+appName;
    if(!VFS.exists(projPath))VFS.mkdir(projPath);
    VFS.write(projPath+'/'+appName+'.kompai',ta.value);
    OS.notify('💾','KompAI',appName+'.kompai gespeichert');
  },

  init(id,opts={}){
    WM.setData(id,{compiling:false,lastBuild:null,lastBuildPath:null,acSuggestion:null});
    const ta=document.getElementById('kai-ta-'+id);
    const pre=document.getElementById('kai-pre-'+id);
    if(!ta)return;
    ta.addEventListener('input',()=>{this._schedHL(id);this._schedAC(id);});
    ta.addEventListener('scroll',()=>{if(pre){pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;}});
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();
        const d=WM.getData(id);
        const acEl=document.getElementById('kai-ac-'+id);
        if(d?.acSuggestion&&acEl?.style.display!=='none'){
          const s=ta.selectionStart;
          ta.value=ta.value.slice(0,s)+' '+d.acSuggestion+ta.value.slice(s);
          ta.selectionStart=ta.selectionEnd=s+1+d.acSuggestion.length;
          acEl.style.display='none';d.acSuggestion=null;
          this._schedHL(id);
        } else {
          const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(s);
          ta.selectionStart=ta.selectionEnd=s+2;this._schedHL(id);
        }
      }
      if(e.key==='Escape'){const acEl=document.getElementById('kai-ac-'+id);if(acEl)acEl.style.display='none';}
      if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();this.compile(id);}
    });
    if(opts.file){const c=VFS.read(opts.file);if(c){ta.value=c;this._syncHL(id);}}
    else this._syncHL(id);
    WM.setCleanup(id,()=>{clearTimeout(this._hlT[id]);clearTimeout(this._acT[id]);delete this._hlT[id];delete this._acT[id];});
  },
};

function _wpOverlays(show) {
  ['water','grass','clouds'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('.bubble').forEach(b => b.style.display = show ? '' : 'none');
}

function _wpApplyImage(url) {
  const wp = document.getElementById('wp');
  if (!wp) return;
  const safe = url.replace(/'/g, '%27');
  // Individuelle Eigenschaften statt background-Shorthand (verhindert Parse-Fehler)
  wp.style.backgroundImage    = "url('" + safe + "')";
  wp.style.backgroundSize     = 'cover';
  wp.style.backgroundPosition = 'center center';
  wp.style.backgroundRepeat   = 'no-repeat';
  wp.classList.add('custom-wp');
}

function setWallpaper(value) {
  const wp = document.getElementById('wp');
  if (!wp) return;
  const isUrl = value && (value.startsWith('http') || value.startsWith('//') || value.startsWith('data:'));

  if (isUrl) {
    // Bild vorab laden — erst bei Erfolg anwenden, bei Fehler Meldung zeigen
    const tester = new Image();
    tester.onload = () => {
      _wpOverlays(false);
      _wpApplyImage(value);
    };
    tester.onerror = () => {
      OS.notify('⚠️', 'Bild nicht ladbar', 'URL prüfen — evtl. kein Hotlinking erlaubt.');
    };
    tester.src = value;
  } else {
    // Individuelle Inline-Styles zuruecksetzen, dann Gradient setzen
    wp.style.backgroundImage    = '';
    wp.style.backgroundSize     = '';
    wp.style.backgroundPosition = '';
    wp.style.backgroundRepeat   = '';
    wp.style.background = WP_PRESETS[value] || WP_PRESETS.ocean;
    wp.classList.remove('custom-wp');
    _wpOverlays(true);
  }
}

</script>
</body>
