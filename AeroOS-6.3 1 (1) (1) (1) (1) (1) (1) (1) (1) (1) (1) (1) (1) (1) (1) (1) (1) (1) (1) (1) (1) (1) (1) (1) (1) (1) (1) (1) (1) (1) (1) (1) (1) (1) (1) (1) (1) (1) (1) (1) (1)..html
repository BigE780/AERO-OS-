<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroOS 6.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
.sel{-webkit-user-select:text!important;user-select:text!important;cursor:text}
:root{--glass:rgba(210,240,255,0.82);--border:rgba(255,255,255,0.75);--shadow:0 12px 48px rgba(0,60,160,0.35),inset 0 1px 0 rgba(255,255,255,0.9);--tb-h:42px;--title-h:30px;--accent:#3a9de0;--text:#0a2a50;--text2:#2a5080;--text3:#4a7090;--blur:blur(18px)}
#wp.custom-wp::before{display:none}
body{width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;color:var(--text);cursor:default;background:#0a2050}
#desktop{width:100%;height:100%;position:relative;overflow:hidden}
#wp{position:absolute;inset:0;background:url('https://ei.phncdn.com/videos/202501/21/463464845/original/(m=eaSaaTbaAaaaa)(mh=1692UvpML_AG7pZ_)16.jpg') center/cover no-repeat}
#wp::before{content:'';position:absolute;top:-40px;left:calc(50% - 100px);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,210,0.9) 0%,rgba(255,230,130,0.6) 30%,transparent 80%);filter:blur(15px)}
#clouds{position:absolute;top:0;left:0;right:0;height:220px;pointer-events:none}
.cloud{position:absolute;border-radius:50px;background:rgba(255,255,255,0.75);filter:blur(8px);animation:drift linear infinite}
@keyframes drift{0%{transform:translateX(-220px)}100%{transform:translateX(calc(100vw + 220px))}}
#water{position:absolute;bottom:0;left:0;right:0;height:38%;background:linear-gradient(180deg,rgba(30,130,200,0.35) 0%,rgba(20,90,170,0.65) 50%,rgba(10,55,120,0.85) 100%);overflow:hidden}
#water::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 5px,rgba(255,255,255,0.035) 5px,rgba(255,255,255,0.035) 6px)}
#grass{position:absolute;bottom:37%;left:0;right:0;height:28px;background:linear-gradient(180deg,#3ab870 0%,#28a060 60%,transparent 100%);filter:blur(3px)}
.bubble{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95) 0%,rgba(180,230,255,0.5) 35%,rgba(80,180,255,0.15) 75%,transparent 100%);border:1px solid rgba(255,255,255,0.65);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.85}100%{transform:translateY(-140px) scale(.3);opacity:0}}
.dicon{position:absolute;width:76px;text-align:center;padding:6px 4px;border-radius:8px;cursor:pointer;transition:background .15s}
.dicon:hover{background:rgba(255,255,255,.22)}
.dicon.sel{background:rgba(80,170,255,.38);outline:1px solid rgba(120,200,255,.7)}
.dicon .ico{font-size:32px;display:block;margin-bottom:4px;filter:drop-shadow(0 3px 6px rgba(0,40,120,.5))}
.dicon .lbl{font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,1),0 0 10px rgba(0,0,0,.8);line-height:1.3;word-break:break-word}
/* Window */
.win{position:absolute;display:flex;flex-direction:column;border-radius:10px 10px 8px 8px;overflow:hidden;box-shadow:var(--shadow);min-width:280px;min-height:180px}
.win.focused{box-shadow:var(--shadow),0 0 0 1px rgba(80,180,255,.5)}
.win.minimized{display:none!important}
.win::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;pointer-events:none;border-radius:10px 10px 0 0;z-index:9;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 100%)}
.titlebar{height:var(--title-h);display:flex;align-items:center;padding:0 6px;gap:5px;cursor:move;flex-shrink:0;background:linear-gradient(180deg,rgba(200,230,255,.97) 0%,rgba(140,200,255,.95) 40%,rgba(90,165,240,.95) 55%,rgba(160,215,255,.9) 100%);border-bottom:1px solid rgba(255,255,255,.6)}
.titlebar .ttl{flex:1;font-size:12px;font-weight:600;color:#0a2050;text-shadow:0 1px 0 rgba(255,255,255,.8);padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 3px rgba(0,0,0,.25);transition:filter .1s}
.wbtn:hover{filter:brightness(1.2)}
.wbtn.cl{background:radial-gradient(circle at 40% 35%,#ff8888,#d02020);color:rgba(80,0,0,.5)}
.wbtn.mn{background:radial-gradient(circle at 40% 35%,#ffe878,#c09800);color:rgba(80,50,0,.5)}
.wbtn.mx{background:radial-gradient(circle at 40% 35%,#88e888,#28a028);color:rgba(0,60,0,.5)}
.wbody{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.rgrip{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:se-resize;z-index:20;background:linear-gradient(135deg,transparent 55%,rgba(80,150,220,.45) 55%)}
/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:var(--tb-h);display:flex;align-items:center;gap:3px;padding:0 6px;z-index:9000;background:linear-gradient(180deg,rgba(70,155,240,.9) 0%,rgba(35,110,210,.95) 35%,rgba(15,70,170,.97) 60%,rgba(8,45,120,.99) 100%);border-top:1px solid rgba(255,255,255,.45);backdrop-filter:blur(20px)}
#startbtn{height:32px;padding:0 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(180deg,rgba(130,210,255,.95) 0%,rgba(70,160,250,.97) 45%,rgba(30,100,210,.97) 55%,rgba(100,180,255,.9) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 6px rgba(0,30,100,.4);text-shadow:0 1px 2px rgba(0,0,80,.5);transition:filter .1s}
#startbtn:hover{filter:brightness(1.1)}
.tsep{width:1px;height:26px;background:rgba(255,255,255,.18);margin:0 2px;flex-shrink:0}
#tbbuts{display:flex;gap:3px;flex:1;overflow:hidden;align-items:center}
.tbtn{height:32px;padding:0 10px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#ddf;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:150px;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.act{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
.tbico{font-size:15px}
#systray{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 8px;border-left:1px solid rgba(255,255,255,.18);color:#cce}
#clk{text-align:center;cursor:default;line-height:1.35}
#clk .ct{font-size:14px;font-weight:600}
#clk .cd{font-size:10px;opacity:.8}
/* Start Menu */
#sm{position:fixed;bottom:var(--tb-h);left:8px;width:380px;z-index:9500;display:none;border-radius:10px 10px 3px 3px;overflow:hidden;box-shadow:0 -6px 40px rgba(0,30,120,.65),0 0 0 1px rgba(255,255,255,.35);backdrop-filter:blur(24px)}
#sm.open{display:block}
.sm-head{padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(50,130,220,.97),rgba(20,80,180,.99));border-bottom:1px solid rgba(255,255,255,.3)}
.sm-av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#80c8ff,#3888e0);border:2px solid rgba(255,255,255,.7)}
.sm-user{color:#fff;font-size:15px;font-weight:600}
.sm-sub{font-size:11px;color:#90ccff}
.sm-body{display:flex;height:330px;background:linear-gradient(180deg,rgba(215,240,255,.97),rgba(195,228,255,.97))}
.sm-l{flex:1;overflow-y:auto;padding:6px 0;border-right:1px solid rgba(100,160,220,.3)}
.sm-r{width:145px;padding:6px 0;background:rgba(160,205,245,.3)}
.sm-sec{padding:5px 14px 2px;font-size:10px;font-weight:700;color:#3a68a8;text-transform:uppercase;letter-spacing:.6px}
.sm-it{padding:7px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--text);font-size:13px;transition:background .12s}
.sm-it:hover{background:linear-gradient(90deg,rgba(80,170,255,.4),rgba(80,170,255,.08))}
.sm-it .si{font-size:18px}
.sm-foot{padding:8px 12px;display:flex;justify-content:flex-end;gap:8px;background:linear-gradient(180deg,rgba(20,80,180,.97),rgba(8,50,140,.99));border-top:1px solid rgba(255,255,255,.2)}
.sm-fbtn{padding:4px 14px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#ddf;font-size:12px;cursor:pointer;transition:background .12s}
.sm-fbtn:hover{background:rgba(255,255,255,.24)}
/* Context Menu */
#ctx{position:fixed;z-index:9800;min-width:185px;display:none;background:rgba(215,240,255,.97);backdrop-filter:blur(16px);border-radius:6px;border:1px solid rgba(100,170,230,.65);box-shadow:0 6px 24px rgba(0,50,140,.35),inset 0 1px 0 rgba(255,255,255,.85);padding:4px 0;overflow:hidden}
.ci{padding:6px 20px;cursor:pointer;color:var(--text);font-size:12px;transition:background .1s}
.ci:hover{background:linear-gradient(90deg,rgba(80,170,255,.45),rgba(80,170,255,.1))}
.csep{height:1px;background:rgba(80,160,220,.3);margin:3px 10px}
/* Notifications */
#notif{position:fixed;bottom:calc(var(--tb-h) + 10px);right:10px;width:290px;z-index:9900;padding:12px 14px;border-radius:10px;display:none;opacity:0;transition:opacity .3s;background:rgba(215,242,255,.97);backdrop-filter:blur(16px);border:1px solid rgba(100,185,255,.65);box-shadow:0 6px 24px rgba(0,60,180,.3),inset 0 1px 0 rgba(255,255,255,.85)}
#notif.show{display:flex;opacity:1;gap:10px;align-items:flex-start}
#notif .ni{font-size:22px;flex-shrink:0}
#notif .nt{font-size:13px;font-weight:700;color:#0a2a50}
#notif .nm{font-size:12px;color:#2a5080;margin-top:2px}
/* Scrollbars */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:rgba(160,210,250,.25)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(80,170,255,.6),rgba(40,120,220,.7));border-radius:4px}
/* Generic toolbar */
.toolbar{padding:4px 6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0;background:linear-gradient(180deg,rgba(200,232,255,.95),rgba(175,218,255,.9));border-bottom:1px solid rgba(100,170,230,.3)}
.tbut{padding:2px 10px;border-radius:4px;border:1px solid rgba(100,165,225,.45);background:rgba(255,255,255,.6);color:var(--text);font-size:11px;cursor:pointer;transition:background .1s;white-space:nowrap}
.tbut:hover{background:rgba(170,220,255,.75)}
.tbut.active{background:linear-gradient(180deg,rgba(140,210,255,.85),rgba(90,170,240,.8));border-color:rgba(60,130,220,.6)}
.tsplit{width:1px;height:18px;background:rgba(100,160,220,.35);margin:0 2px;flex-shrink:0}
/* ═══ CODE EDITOR ═══ */
.ce-tabs{display:flex;background:rgba(180,220,255,.85);border-bottom:1px solid rgba(100,170,230,.4);overflow-x:auto;flex-shrink:0}
.ce-tab{padding:5px 14px;font-size:11px;cursor:pointer;white-space:nowrap;border-right:1px solid rgba(100,170,230,.3);color:var(--text2);display:flex;align-items:center;gap:5px;transition:background .1s;flex-shrink:0}
.ce-tab:hover{background:rgba(200,235,255,.8)}
.ce-tab.active{background:rgba(240,252,255,.95);color:var(--text);font-weight:600;border-bottom:2px solid var(--accent)}
.ce-tab .tab-close{font-size:10px;color:#888;padding:0 2px;border-radius:2px;line-height:1}
.ce-tab .tab-close:hover{background:rgba(255,80,80,.2);color:#c00}
.ce-tab .dot{width:6px;height:6px;border-radius:50%;background:#f90;display:inline-block}
.ce-toolbar{padding:3px 6px;display:flex;align-items:center;gap:4px;flex-shrink:0;background:linear-gradient(180deg,rgba(200,232,255,.95),rgba(175,218,255,.9));border-bottom:1px solid rgba(100,170,230,.3)}
.ce-main{flex:1;display:flex;overflow:hidden;position:relative}
.ce-gutter{width:44px;overflow:hidden;flex-shrink:0;padding:8px 0;text-align:right;border-right:1px solid rgba(100,170,230,.3)}
.ce-gutter span{display:block;height:calc(1em * 1.55);padding-right:8px;font:11px/1.55 Consolas,'Courier New',monospace;user-select:none;pointer-events:none}
.ce-inner{flex:1;position:relative;overflow:hidden}
.ce-pre,.ce-ta{position:absolute;top:0;left:0;width:100%;height:100%;padding:8px 12px;margin:0;font:13px/1.55 Consolas,'Courier New',monospace;tab-size:2;-moz-tab-size:2;white-space:pre;overflow:auto;box-sizing:border-box}
.ce-pre{pointer-events:none;z-index:0;word-break:normal}
.ce-ta{color:transparent;background:transparent;z-index:1;border:none;outline:none;resize:none;-webkit-user-select:text;user-select:text;word-break:normal}
.ce-status{padding:3px 10px;font-size:11px;color:var(--text3);background:rgba(180,220,255,.7);border-top:1px solid rgba(100,170,230,.3);flex-shrink:0;display:flex;gap:12px;align-items:center}
.ce-status span{white-space:nowrap}
/* Editor theme switcher */
.theme-sel{padding:2px 6px;border:1px solid rgba(100,165,225,.45);border-radius:4px;background:rgba(255,255,255,.6);color:var(--text);font-size:11px;cursor:pointer;outline:none}
.lang-sel{padding:2px 6px;border:1px solid rgba(100,165,225,.45);border-radius:4px;background:rgba(255,255,255,.6);color:var(--text);font-size:11px;cursor:pointer;outline:none}
/* Find bar */
.find-bar{display:flex;align-items:center;gap:4px;padding:3px 6px;background:rgba(220,240,255,.95);border-top:1px solid rgba(100,170,230,.35);flex-shrink:0}
.find-bar input{flex:1;padding:2px 7px;border:1px solid rgba(100,165,225,.5);border-radius:4px;background:rgba(255,255,255,.9);font-size:12px;color:var(--text);outline:none;-webkit-user-select:text;user-select:text}
.find-bar.hidden{display:none}
/* ═══ BROWSER ═══ */
.br-nav{padding:4px 6px;display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,rgba(200,232,255,.97),rgba(175,218,255,.93));border-bottom:1px solid rgba(100,170,230,.3);flex-shrink:0}
.br-url{flex:1;padding:4px 10px;border:1px solid rgba(100,165,225,.5);border-radius:14px;background:rgba(255,255,255,.88);font-size:12px;color:var(--text);outline:none;-webkit-user-select:text;user-select:text}
.br-go{padding:3px 10px;border-radius:10px;border:1px solid rgba(100,165,225,.5);background:linear-gradient(180deg,rgba(200,235,255,.9),rgba(140,205,255,.9));color:var(--text);font-size:12px;cursor:pointer}
.br-go:hover{filter:brightness(1.08)}
.br-iframe{flex:1;border:none;background:#fff}
.br-home{flex:1;overflow-y:auto;padding:14px;background:rgba(240,250,255,.95)}
.br-home h2{font-size:14px;color:var(--accent);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid rgba(100,165,225,.3)}
.br-file{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text);transition:background .1s;border:1px solid transparent}
.br-file:hover{background:rgba(100,185,255,.2);border-color:rgba(100,185,255,.4)}
.br-file .bf-path{font-size:10px;color:var(--text3)}
/* File Manager */
.fm-nav{padding:4px 8px;display:flex;align-items:center;gap:5px;background:rgba(200,232,255,.95);border-bottom:1px solid rgba(100,170,230,.3)}
.fm-addr{flex:1;padding:3px 8px;border:1px solid rgba(100,165,225,.5);border-radius:4px;background:rgba(255,255,255,.75);font-size:12px;color:var(--text);outline:none;-webkit-user-select:text;user-select:text}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:10px;overflow-y:auto;flex:1}
.fm-item{padding:8px 6px;border-radius:6px;text-align:center;cursor:pointer;transition:background .12s;border:1px solid transparent}
.fm-item:hover{background:rgba(100,185,255,.22);border-color:rgba(100,185,255,.4)}
.fm-item.sel{background:rgba(80,170,255,.32);border-color:rgba(80,170,255,.6)}
.fm-ico{font-size:30px;display:block;margin-bottom:4px}
.fm-nm{font-size:10px;color:var(--text);word-break:break-all;line-height:1.25}
.fm-status{padding:3px 10px;font-size:11px;color:var(--text3);background:rgba(180,220,255,.7);border-top:1px solid rgba(100,170,230,.3);flex-shrink:0}
/* Terminal */
.term-out{flex:1;overflow-y:auto;padding:8px 10px;font-family:Consolas,'Courier New',monospace;font-size:12px;line-height:1.55;color:#c8e8ff;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.term-in-row{display:flex;align-items:center;padding:4px 10px 8px;flex-shrink:0}
.term-prompt{font-family:Consolas,'Courier New',monospace;font-size:12px;color:#50d0a0;white-space:nowrap;margin-right:6px}
#tinput-holder{flex:1}
.tcmd{color:#a0d8ff}.tok{color:#88ff88}.terr{color:#ff8888}.twarn{color:#ffdd88}.tdir{color:#60c0ff;font-weight:600}.tfile{color:#c8e8ff}.thl{color:#50d0a0;font-weight:600}
/* Calculator */
.calc-body{flex:1;display:flex;flex-direction:column;padding:10px;gap:6px;background:linear-gradient(160deg,rgba(200,235,255,.95),rgba(175,220,255,.9))}
.calc-disp{background:rgba(10,30,70,.92);border-radius:8px;padding:8px 14px;border:1px solid rgba(255,255,255,.3)}
.calc-expr{font-family:Consolas,monospace;font-size:11px;color:#80b8e8;min-height:16px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.calc-num{font-family:Consolas,monospace;font-size:28px;color:#c8eaff;text-align:right;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:1}
.cb{border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:filter .1s;box-shadow:0 2px 5px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5)}
.cb:hover{filter:brightness(1.12)}
.cb:active{filter:brightness(.9);transform:scale(.97)}
.cb.num{background:linear-gradient(180deg,rgba(220,242,255,.97),rgba(190,225,255,.95));color:var(--text)}
.cb.op{background:linear-gradient(180deg,rgba(140,210,255,.97),rgba(90,175,245,.95));color:#0a2a50}
.cb.fn{background:linear-gradient(180deg,rgba(100,185,255,.9),rgba(55,145,235,.9));color:#fff;font-size:11px}
.cb.eq{background:linear-gradient(180deg,rgba(80,200,120,.97),rgba(40,160,80,.95));color:#fff}
.cb.cl{background:linear-gradient(180deg,rgba(255,150,120,.97),rgba(220,80,50,.95));color:#fff}
.cb.span2{grid-column:span 2}
/* Paint */
.paint-wrap{flex:1;display:flex;overflow:hidden}
.paint-tools{width:48px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0;background:linear-gradient(180deg,rgba(195,228,255,.97),rgba(170,215,255,.95));border-right:1px solid rgba(100,170,230,.35)}
.ptool{width:36px;height:36px;border-radius:6px;border:1px solid rgba(100,165,225,.4);background:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .1s}
.ptool:hover{background:rgba(160,220,255,.7)}
.ptool.act{background:linear-gradient(180deg,rgba(120,205,255,.95),rgba(70,170,245,.9));border-color:rgba(50,130,220,.7)}
.paint-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.paint-colors{padding:4px 6px;display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0;align-items:center;background:linear-gradient(180deg,rgba(200,232,255,.95),rgba(175,218,255,.9));border-bottom:1px solid rgba(100,170,230,.3)}
.pcolor{width:20px;height:20px;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.25);transition:transform .1s;flex-shrink:0}
.pcolor:hover{transform:scale(1.2)}
.pcolor.act{border:2px solid #fff;box-shadow:0 0 0 2px #3a9de0;transform:scale(1.15)}
.paint-canvas-wrap{flex:1;overflow:auto;background:rgba(200,230,255,.4)}
/* Settings */
.set-body{flex:1;overflow-y:auto;padding:0}
.set-sec{padding:14px 18px}
.set-sec-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(100,165,225,.35)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(100,165,225,.12)}
.set-lbl{font-size:13px;color:var(--text)}
.set-desc{font-size:11px;color:var(--text3);margin-top:2px}

<script>
'use strict';
// ══════════════════════════════════════════
//  VFS
// ══════════════════════════════════════════
const VFS = (() => {
  const ts = () => new Date().toISOString();
  const mkF = (n, c='') => ({type:'file',name:n,content:c,size:c.length,created:ts(),modified:ts()});
  const mkD = (n, ch={}) => ({type:'dir',name:n,children:ch,created:ts(),modified:ts()});

  const HELLO_HTML = `<!DOCTYPE html>

<head>

</head>

  const HELLO_CSS = `body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a5080, #0a3060);
  min-height: 100vh;
  display: flex;
  align-items: center;

}
.card {
  background: rgba(200, 235, 255, 0.15);

  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 16px;

}
h1 { font-size: 28px; margin-bottom: 16px; }
p { line-height: 1.7; margin-bottom: 12px; opacity: 0.9; }
code { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; }
button {
  background: linear-gradient(180deg, #60b8ff, #2888e0);
  border: none; color: white; padding: 10px 24px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,80,200,0.4);

}
button:hover { transform: scale(1.05); }

  const HELLO_JS = `function greet() {

  ];

  document.getElementById('msg').textContent = messages[idx];
}
// Auto-greet on load
window.onload = () => {
  console.log('app.js loaded successfully');
  document.getElementById('msg').textContent = 'JS loaded! Click the button.';
};`;

  const TODO_HTML = `<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>📋 Todo App</h1>
    <div class="input-row">
      <input id="inp" type="text" placeholder="Neue Aufgabe...">
      <button onclick="addTodo()">Hinzufügen</button>
    </div>
    <ul id="list"></ul>
    <div class="footer" id="footer">0 Aufgaben</div>
  </div>
  <script src="app.js"><\/script>
</body>
</html>`;

  const TODO_CSS = `* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f2040;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
}
.app {
  width: 100%; max-width: 480px;
  background: rgba(220, 240, 255, 0.1);
  border-radius: 14px;
  padding: 24px;
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
}
h1 { font-size: 22px; margin-bottom: 18px; }
.input-row { display: flex; gap: 8px; margin-bottom: 18px; }
input {
  flex: 1; padding: 10px 14px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.1); color: white;
  font-size: 13px; outline: none;
}

  padding: 10px 16px; border-radius: 8px; border: none;
  background: #3a9de0; color: white; cursor: pointer; font-size: 13px;
}

ul { list-style: none; }
li {
  padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
  background: rgba(255,255,255,0.08); display: flex;
  align-items: center; gap: 10px; cursor: pointer;
  transition: background 0.1s;
}
li:hover { background: rgba(255,255,255,0.13); }
li.done { opacity: 0.5; text-decoration: line-through; }
li .del { margin-left: auto; color: #ff8888; font-size: 16px; }
.footer { margin-top: 14px; font-size: 12px; color: rgba(255,255,255,0.5); }`;

  const TODO_JS = `let todos = [];
function addTodo() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  todos.push({ text, done: false, id: Date.now() });
  inp.value = '';
  render();
}
function toggleTodo(id) {
  const t = todos.find(t => t.id === id);
  if (t) { t.done = !t.done; render(); }
}
function delTodo(id) {
  todos = todos.filter(t => t.id !== id);
  render();
}
function render() {
  const ul = document.getElementById('list');
  ul.innerHTML = todos.map(t => \`
    <li class="\${t.done?'done':''}" onclick="toggleTodo(\${t.id})">
      \${t.done ? '✅' : '⬜'} \${t.text}
      <span class="del" onclick="event.stopPropagation();delTodo(\${t.id})">✕</span>
    </li>\`).join('');
  const rem = todos.filter(t=>!t.done).length;
  document.getElementById('footer').textContent = \`\${todos.length} Aufgaben, \${rem} offen\`;
}
document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });`;

  const root = mkD('/', {
    home: mkD('home', {
      user: mkD('user', {
        Documents: mkD('Documents', {
          'readme.txt': mkF('readme.txt', 'AeroOS 6.2 — Code Editor + Browser Edition\n\nNeu:\n  - Syntax-Highlighting Editor (HTML/CSS/JS/JSON)\n  - 6 Themes: Dracula, Monokai, GitHub, Aero, Nord, Solarized\n  - Datei-Tabs, Auto-Indent, Auto-Close\n  - Browser rendert VFS HTML mit CSS/JS Verlinkung\n  - Terminal mit vollem VFS-Zugriff\n\nProjekte: ~/Projects/\n\nTerminal-Befehle: help'),
          'notizen.txt': mkF('notizen.txt', 'Meine Notizen\n=============\nZeile 1\nZeile 2\nZeile 3'),
        }),
        Projects: mkD('Projects', {
          'hello-world': mkD('hello-world', {
            'index.html': mkF('index.html', HELLO_HTML),
            'style.css':  mkF('style.css',  HELLO_CSS),
            'app.js':     mkF('app.js',      HELLO_JS),
          }),
          'todo-app': mkD('todo-app', {
            'index.html': mkF('index.html', TODO_HTML),
            'style.css':  mkF('style.css',  TODO_CSS),
            'app.js':     mkF('app.js',      TODO_JS),
          }),
        }),
        Downloads: mkD('Downloads', {}),
        Desktop: mkD('Desktop', {}),
      }),
    }),
    etc: mkD('etc', {
      'aeroos.conf': mkF('aeroos.conf', '[system]\nname=AeroOS\nversion=6.2\nbuild=2024\n\n[network]\nhostname=aeroos-pc'),
      'hosts': mkF('hosts', '127.0.0.1  localhost\n::1        localhost'),
    }),
    tmp: mkD('tmp', {}),
    var: mkD('var', { log: mkD('log', { 'system.log': mkF('system.log', '[BOOT] AeroOS 6.2 gestartet\n[INFO] VFS initialisiert\n[INFO] Code-Editor geladen\n[INFO] Browser geladen') }) }),
    projekte: mkD('projekte', {}),
  });

  function resolve(path, cwd='/') {
    if (!path) return cwd;
    let parts = path.startsWith('/') ? path.split('/') : [...cwd.split('/'), ...path.split('/')];
    const res = [];
    for (const p of parts) { if (!p || p==='.') continue; if (p==='..') res.pop(); else res.push(p); }
    return '/'+res.join('/');
  }
  function getNode(path) {
    if (!path || path==='/') return root;
    let cur = root;
    for (const p of path.split('/').filter(Boolean)) { if (!cur || cur.type!=='dir') return null; cur=cur.children[p]; }
    return cur||null;
  }
  function splitPath(path) {
    const i = path.lastIndexOf('/');
    return i<=0 ? ['/', path.slice(1)] : [path.slice(0,i)||'/', path.slice(i+1)];
  }
  return {
    resolve, getNode, splitPath,
    list(p) { const n=getNode(p); return n&&n.type==='dir'?Object.values(n.children):null; },
    read(p) { const n=getNode(p); return n&&n.type==='file'?n.content:null; },
    write(p, c) {
      const [par,name]=splitPath(p); const parent=getNode(par);
      if (!parent||parent.type!=='dir') return false;
      if (parent.children[name]) { parent.children[name].content=c; parent.children[name].size=c.length; parent.children[name].modified=ts(); }
      else parent.children[name]=mkF(name,c);
      return true;
    },
    mkdir(p) { const [par,name]=splitPath(p); const parent=getNode(par); if(!parent||parent.type!=='dir'||parent.children[name]) return false; parent.children[name]=mkD(name); return true; },
    rm(p) { const [par,name]=splitPath(p); const parent=getNode(par); if(!parent||!parent.children[name]) return false; delete parent.children[name]; return true; },
    mv(s,d) { const sn=getNode(s); if(!sn) return false; const [dp,dn]=splitPath(d); const dpar=getNode(dp); if(!dpar||dpar.type!=='dir') return false; dpar.children[dn]={...JSON.parse(JSON.stringify(sn)),name:dn}; this.rm(s); return true; },
    cp(s,d) { const sn=getNode(s); if(!sn) return false; const [dp,dn]=splitPath(d); const dpar=getNode(dp); if(!dpar||dpar.type!=='dir') return false; dpar.children[dn]=JSON.parse(JSON.stringify({...sn,name:dn})); return true; },
    exists(p) { return !!getNode(p); },
    type(p) { const n=getNode(p); return n?n.type:null; },
    // Find all HTML files recursively
    findHTML(startPath='/') {
      const results=[];
      function walk(p) {
        const items=this.list(p)||[];
        items.forEach(f=>{
          const fp=(p==='/'?'':p)+'/'+f.name;
          if(f.type==='dir') walk.call(this,fp);
          else if(f.name.endsWith('.html')) results.push(fp);
        });
      }
      walk.call(this,startPath);
      return results;
    },
    // Resolve VFS HTML: inline linked CSS/JS
    resolveHTML(path) {
      let html = this.read(path);
      if (html===null) return null;
      const dir = path.slice(0, path.lastIndexOf('/')) || '/';
      // Inline <link rel="stylesheet" href="...">
      html = html.replace(/<link([^>]*)href=["']([^"']+)["']([^>]*)>/gi, (m, a1, href, a2) => {
        if (/rel=["']stylesheet["']/.test(a1+a2) && !href.startsWith('http')) {
          const cp = this.resolve(href, dir);
          const css = this.read(cp);
          if (css!==null) return `<style>/* VFS: ${href} */\n${css}</style>`;
        }
        return m;
      });
      // Inline <script src="...">
      html = html.replace(/<script([^>]*)\bsrc=["']([^"']+)["']([^>]*)><\/script>/gi, (m, a1, src, a2) => {
        if (!src.startsWith('http')) {
          const jp = this.resolve(src, dir);
          const js = this.read(jp);
          if (js!==null) return `<script${a1}${a2}>/* VFS: ${src} */\n${js}<`+`/script>`;
        }
        return m;
      });
      return html;
    }
  };
})();

    nord:      {bg:'#2e3440',fg:'#d8dee9',kw:'#81a1c1',str:'#a3be8c',num:'#b48ead',cmt:'#616e88',fn:'#88c0d0',tag:'#81a1c1',attr:'#88c0d0',val:'#a3be8c',sel:'#81a1c1',prop:'#8fbcbb',op:'#81a1c1',gutter:'#3b4252',gutFg:'#4c566a',cur:'#d8dee9'},

  },
  getLang(file) {
    const ext = (file||'').split('.').pop().toLowerCase();
    return {js:'js',javascript:'js',ts:'js',mjs:'js',cjs:'js',css:'css',scss:'css',less:'css',html:'html',htm:'html',xml:'html',svg:'html',json:'json',md:'md',txt:'',sh:'sh',conf:'',log:''}[ext] || '';
  },
  esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); },
  span(color, text) { return `<span style="color:${color}">${text}</span>`; },

  hl(code, lang, theme='dracula') {
    const t = this.themes[theme] || this.themes.dracula;
    const s = this.span.bind(this);
    const e = this.esc.bind(this);
    if (!lang) return e(code);
    if (lang==='js') return this.hlJS(code,t,s,e);
    if (lang==='css') return this.hlCSS(code,t,s,e);
    if (lang==='html') return this.hlHTML(code,t,s,e);
    if (lang==='json') return this.hlJSON(code,t,s,e);
    if (lang==='sh') return this.hlSH(code,t,s,e);
    return e(code);
  },

  // Full tokenizer for JS
  hlJS(code, t, s, e) {
    const KW = new Set('break case catch class const continue debugger default delete do else export extends false finally for from function get if import in instanceof let new null of return set static super switch this throw true try typeof undefined var void while with yield async await'.split(' '));
    let out='', i=0, L=code.length;
    while(i<L) {
      const ch=code[i];
      if(ch==='/'&&code[i+1]==='*'){const end=code.indexOf('*/',i+2);const e2=end===-1?L:end+2;out+=s(t.cmt,e(code.slice(i,e2)));i=e2;continue;}
      if(ch==='/'&&code[i+1]==='/'){let e2=code.indexOf('\n',i);if(e2===-1)e2=L;out+=s(t.cmt,e(code.slice(i,e2)));i=e2;continue;}
      if(ch==='`'){let j=i+1,r='`';while(j<L){if(code[j]==='\\'){r+=e(code[j])+e(code[j+1]);j+=2;continue;}if(code[j]==='`'){r+='`';j++;break;}r+=e(code[j++]);}out+=s(t.str,r);i=j;continue;}
      if(ch==='"'||ch==="'"){let j=i+1,r=e(ch),q=ch;while(j<L){if(code[j]==='\\'){r+=e(code[j])+e(code[j+1]);j+=2;continue;}if(code[j]===q){r+=e(q);j++;break;}r+=e(code[j++]);}out+=s(t.str,r);i=j;continue;}
      if(/[0-9]/.test(ch)||(ch==='.'&&i+1<L&&/[0-9]/.test(code[i+1]))){let j=i;while(j<L&&/[0-9._xXeEoObB]/.test(code[j]))j++;out+=s(t.num,e(code.slice(i,j)));i=j;continue;}
      if(/[a-zA-Z_$]/.test(ch)){let j=i;while(j<L&&/[a-zA-Z0-9_$]/.test(code[j]))j++;const w=code.slice(i,j);let k=j;while(k<L&&(code[k]===' '||code[k]==='\t'))k++;const isCall=code[k]==='(';if(KW.has(w))out+=s(t.kw,e(w));else if(isCall)out+=s(t.fn,e(w));else if(/^[A-Z][A-Z0-9_]*$/.test(w)||/^[A-Z][a-zA-Z]/.test(w))out+=s(t.prop,e(w));else out+=e(w);i=j;continue;}
      if(/[+\-*/%=!<>&|^~?:,;.]/.test(ch)){out+=s(t.op,e(ch));i++;continue;}
      out+=e(ch);i++;
    }
    return out;
  },

  hlCSS(code, t, s, e) {
    let out='', i=0, L=code.length, inRule=false;
    while(i<L) {
      const ch=code[i];
      if(ch==='/'&&code[i+1]==='*'){const end=code.indexOf('*/',i+2);const e2=end===-1?L:end+2;out+=s(t.cmt,e(code.slice(i,e2)));i=e2;continue;}
      if(ch==='"'||ch==="'"){let j=i+1,r=e(ch),q=ch;while(j<L){if(code[j]===q){r+=e(q);j++;break;}r+=e(code[j++]);}out+=s(t.str,r);i=j;continue;}
      if(ch==='{'){out+=s(t.op,'{');inRule=true;i++;continue;}
      if(ch==='}'){out+=s(t.op,'}');inRule=false;i++;continue;}
      // Inside rule: property: value;
      if(inRule&&/[a-zA-Z-]/.test(ch)) {
        let j=i; while(j<L&&/[a-zA-Z0-9-]/.test(code[j]))j++;
        const w=code.slice(i,j); let k=j; while(k<L&&code[k]===' ')k++;
        if(code[k]===':'){out+=s(t.prop,e(w));i=j;}else out+=e(w);
        continue;
      }
      // Colors #xxx
      if(ch==='#'&&inRule){let j=i+1;while(j<L&&/[0-9a-fA-F]/.test(code[j]))j++;out+=s(t.num,e(code.slice(i,j)));i=j;continue;}
      // Numbers with units
      if(/[0-9]/.test(ch)&&inRule){let j=i;while(j<L&&/[0-9.]/.test(code[j]))j++;const u=['px','em','rem','vh','vw','%','s','ms','pt','deg'];let unit='';for(const un of u){if(code.startsWith(un,j)){unit=un;break;}}out+=s(t.num,e(code.slice(i,j)+unit));i=j+unit.length;continue;}
      // Selector pseudo-classes
      if(ch===':'&&!inRule){out+=s(t.kw,':');i++;let j=i;while(j<L&&/[a-zA-Z-()]/.test(code[j]))j++;out+=s(t.kw,e(code.slice(i,j)));i=j;continue;}
      // @rules
      if(ch==='@'){let j=i;while(j<L&&/[a-zA-Z-]/.test(code[j]))j++;out+=s(t.kw,e(code.slice(i,j)));i=j;continue;}
      out+=e(ch);i++;
    }
    return out;
  },

  hlHTML(code, t, s, e) {
    // Tokenize as a state machine: outside tag / inside tag
    let out='', i=0, L=code.length;
    while(i<L) {
      // Comment
      if(code.startsWith('<!--',i)){const end=code.indexOf('-->',i+4);const e2=end===-1?L:end+3;out+=s(t.cmt,e(code.slice(i,e2)));i=e2;continue;}
      // CDATA / script/style content (simple: just highlight interior as JS/CSS)
      if(code.startsWith('<script',i)){
        const closeTag=code.indexOf('<'+'/script>',i);
        const tagEnd=code.indexOf('>',i)+1;
        // tag part
        out+=this.hlTag(code.slice(i,tagEnd),t,s,e);
        if(closeTag===-1){i=tagEnd;continue;}
        const innerJS=code.slice(tagEnd,closeTag);
        out+=this.hlJS(innerJS,t,s,e);
        out+=s(t.tag,e('<'+'/script>'));
        i=closeTag+9; continue;
      }
      if(code.startsWith('<style',i)){
        const closeTag=code.indexOf('</style>',i);
        const tagEnd=code.indexOf('>',i)+1;
        out+=this.hlTag(code.slice(i,tagEnd),t,s,e);
        if(closeTag===-1){i=tagEnd;continue;}
        const innerCSS=code.slice(tagEnd,closeTag);
        out+=this.hlCSS(innerCSS,t,s,e);
        out+=s(t.tag,e('</style>'));
        i=closeTag+8; continue;
      }
      // Tags
      const ch=code[i];if(ch==='<'){
        const end=code.indexOf('>',i);
        if(end===-1){out+=e(code.slice(i));i=L;continue;}
        out+=this.hlTag(code.slice(i,end+1),t,s,e);
        i=end+1; continue;
      }
      // Entity
      if(ch==='&'){const end=code.indexOf(';',i);if(end>0&&end-i<12){out+=s(t.num,e(code.slice(i,end+1)));i=end+1;continue;}}
      out+=e(code[i]);i++;
    }
    return out;
  },

  hlTag(tag, t, s, e) {
    // tag = '<tagname attr="val" ...>' or '</tagname>'
    let out='';
    const m = tag.match(/^(<\/?)([\w:-]*)(.*)?(\/?>)$/s);
    if (!m) return e(tag);
    out += s(t.op, e(m[1])); // < or </
    out += s(t.tag, e(m[2])); // tag name
    // attrs
    let attrs = m[3]||'', ai=0, aL=attrs.length;
    while(ai<aL) {
      // skip space
      if(/\s/.test(attrs[ai])){out+=attrs[ai++];continue;}
      // attr name
      let j=ai; while(j<aL&&!/[\s=\/>]/.test(attrs[j]))j++;
      if(j>ai){out+=s(t.attr,e(attrs.slice(ai,j)));ai=j;continue;}
      if(attrs[ai]==='='){
        out+=s(t.op,'=');ai++;
        if(attrs[ai]==='"'||attrs[ai]==="'"){
          const q=attrs[ai]; let end=attrs.indexOf(q,ai+1);
          if(end===-1)end=aL;
          out+=s(t.val,e(attrs.slice(ai,end+1)));ai=end+1;
        }
        continue;
      }
      out+=e(attrs[ai++]);
    }
    out+=s(t.op,e(m[4]||'>')); // > or />
    return out;
  },

  hlJSON(code, t, s, e) {
    let out='', i=0, L=code.length;
    while(i<L) {
      const ch=code[i];
      if(ch==='"'){let j=i+1,r='"';while(j<L){if(code[j]==='\\'){r+=e(code[j])+e(code[j+1]);j+=2;continue;}if(code[j]==='"'){r+='"';j++;break;}r+=e(code[j++]);}
        // Is it a key or value? Look for colon after
        let k=j; while(k<L&&code[k]===' ')k++;
        if(code[k]===':') out+=s(t.prop,r); else out+=s(t.str,r);
        i=j;continue;}
      if(/[0-9-]/.test(ch)){let j=i;while(j<L&&/[0-9.eE+\-]/.test(code[j]))j++;out+=s(t.num,e(code.slice(i,j)));i=j;continue;}
      if(code.startsWith('true',i)||code.startsWith('false',i)||code.startsWith('null',i)){const w=code[i]==='t'?'true':code[i]==='f'?'false':'null';out+=s(t.kw,w);i+=w.length;continue;}
      out+=e(ch);i++;
    }
    return out;
  },

  hlSH(code, t, s, e) {
    const SH_KW = /\b(if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|exit|echo|export|local|readonly|source|cd|ls|cat|grep|find|mkdir|rm|mv|cp|chmod|chown|sudo|apt|yum)\b/g;

    out = out.replace(/(#[^\n]*)/g, m=>s(t.cmt,m));
    out = out.replace(/("(?:[^"\\]|\\.)*"|'[^']*')/g, m=>s(t.str,m));
    out = out.replace(SH_KW, m=>s(t.kw,m));
    out = out.replace(/\$\w+/g, m=>s(t.num,m));
    return out;
  }
};

//  WINDOW MANAGER
// ══════════════════════════════════════════
const WM = (() => {
  let zTop=50;
  const wins={};

  function bringToFront(id) {
    const w=document.getElementById('w-'+id); if(!w)return;
    w.style.zIndex=++zTop; w.classList.add('focused');
    document.querySelectorAll('.win').forEach(x=>{if(x.id!=='w-'+id)x.classList.remove('focused');});
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('act',b.dataset.wid===id));
  }
  function makeDraggable(win,handle){
    let mx,my,dr=false;
    handle.addEventListener('mousedown',e=>{if(e.target.classList.contains('wbtn'))return;dr=true;mx=e.clientX-win.offsetLeft;my=e.clientY-win.offsetTop;e.preventDefault();});
    window.addEventListener('mousemove',e=>{
      if(!dr)return;
      win.style.left=(e.clientX-mx)+'px';
      win.style.top=(e.clientY-my)+'px';
    });
    window.addEventListener('mouseup',e=>{
      if(!dr)return;
      dr=false;
      // Snap back if window is completely off-screen (at least 40px must be visible)
      const margin=40;
      const tb=44; // taskbar height
      let l=win.offsetLeft;
      let t=win.offsetTop;
      const w=win.offsetWidth;
      const h=win.offsetHeight;
      const vw=window.innerWidth;
      const vh=window.innerHeight-tb;
      // Clamp so at least `margin` px is visible on each edge
      if(l+w < margin)  l = margin-w;   // too far left
      if(l > vw-margin) l = vw-margin;  // too far right
      if(t < -h+margin) t = -h+margin;  // too far up (titlebar still grabbable)
      if(t > vh-margin) t = vh-margin;  // too far down
      win.style.left=l+'px';
      win.style.top=t+'px';
    });
  }
  function makeResizable(win,id){
    const g=win.querySelector('.rgrip'); if(!g)return;
    let sx,sy,sw,sh,rs=false;
    g.addEventListener('mousedown',e=>{rs=true;sx=e.clientX;sy=e.clientY;sw=win.offsetWidth;sh=win.offsetHeight;e.preventDefault();e.stopPropagation();});
    window.addEventListener('mousemove',e=>{if(!rs)return;win.style.width=Math.max(320,sw+e.clientX-sx)+'px';win.style.height=Math.max(220,sh+e.clientY-sy)+'px';if(wins[id]?.onresize)wins[id].onresize();});
    window.addEventListener('mouseup',()=>rs=false);
  }
  return {
    open(app) {
      const id=app.id+'-'+Date.now();
      const dw=window.innerWidth,dh=window.innerHeight-44;
      const x=Math.max(20,Math.min(Math.random()*(dw-app.w-40)+20,dw-app.w-20));
      const y=Math.max(20,Math.min(Math.random()*(dh-app.h-40)+20,dh-app.h-20));
      const win=document.createElement('div');
      win.className='win';win.id='w-'+id;
      win.style.cssText=`left:${x}px;top:${y}px;width:${app.w}px;height:${app.h}px;z-index:${++zTop}`;
      win.innerHTML=`<div class="titlebar" id="tb-${id}"><button class="wbtn cl" title="Schließen" onclick="WM.close('${id}')">✕</button><button class="wbtn mn" title="Minimieren" onclick="WM.minimize('${id}')">─</button><button class="wbtn mx" title="Maximieren" onclick="WM.maximize('${id}')">□</button><span class="ttl">${app.icon} ${app.title}</span></div><div class="wbody" id="wb-${id}">${app.html(id)}</div><div class="rgrip"></div>`;
      win.addEventListener('mousedown',()=>bringToFront(id));
      document.getElementById('desktop').appendChild(win);
      makeDraggable(win,document.getElementById('tb-'+id));
      makeResizable(win,id);
      const tb=document.createElement('div');
      tb.className='tbtn act';tb.dataset.wid=id;
      tb.innerHTML=`<span class="tbico">${app.icon}</span><span>${app.title}</span>`;
      tb.onclick=()=>{const w=document.getElementById('w-'+id);if(!w)return;if(w.classList.contains('minimized')){w.classList.remove('minimized');bringToFront(id);}else if(w.style.zIndex==zTop)this.minimize(id);else bringToFront(id);};
      document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('act'));
      document.getElementById('tbbuts').appendChild(tb);
      wins[id]={app,tb};
      if(app.init)app.init(id);
      return id;
    },
    close(id){document.getElementById('w-'+id)?.remove();wins[id]?.tb?.remove();if(wins[id]?.cleanup)wins[id].cleanup();delete wins[id];},
    minimize(id){document.getElementById('w-'+id)?.classList.add('minimized');wins[id]?.tb?.classList.remove('act');},
    maximize(id){
      const w=document.getElementById('w-'+id);if(!w)return;
      if(!wins[id].maxSt){wins[id].maxSt={l:w.style.left,t:w.style.top,ww:w.style.width,h:w.style.height};w.style.cssText+=`;left:0;top:0;width:100vw;height:calc(100vh - var(--tb-h))`;}
      else{const s=wins[id].maxSt;Object.assign(w.style,{left:s.l,top:s.t,width:s.ww,height:s.h});delete wins[id].maxSt;}
      if(wins[id]?.onresize)wins[id].onresize();
    },
    bringToFront,
    setData(id,d){if(wins[id])wins[id].data=d;},
    getData(id){return wins[id]?.data;},
    setCleanup(id,fn){if(wins[id])wins[id].cleanup=fn;},
    setResize(id,fn){if(wins[id])wins[id].onresize=fn;},
  };
})();

      <div class="ce-gutter" id="cegutter-${id}"></div>
      <div class="ce-inner">
        <pre class="ce-pre" id="cepre-${id}"></pre>
        <textarea class="ce-ta" id="ceta-${id}" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </div>
    <div class="find-bar hidden" id="cefind-${id}">
      <input type="text" placeholder="Suchen..." id="cefindinp-${id}" onkeydown="CodeEditorApp.findKey('${id}',event)">
      <input type="text" placeholder="Ersetzen..." id="cereplceinp-${id}">
      <button class="tbut" onclick="CodeEditorApp.findNext('${id}')">▼ Weiter</button>
      <button class="tbut" onclick="CodeEditorApp.replaceCurrent('${id}')">Ersetzen</button>
      <button class="tbut" onclick="CodeEditorApp.replaceAll('${id}')">Alle ersetzen</button>
      <button class="tbut" onclick="CodeEditorApp.toggleFind('${id}')">✕</button>
    </div>
    <div class="ce-status" id="cest-${id}">
      <span id="cest-pos-${id}">Ln 1, Sp 1</span>
      <span id="cest-file-${id}">Unbenannt</span>
      <span id="cest-lang-${id}">JavaScript</span>
      <span id="cest-chars-${id}">0 Zeichen</span>
    </div>`;
  },
  init(id, opts={}){
    const state = {
      tabs:[], // [{path,content,lang,modified,savedContent}]
      cur:0,
      theme:'dracula',
      findOpen:false,
      findIdx:0,
    };
    WM.setData(id,state);
    // Open initial file or blank
    if(opts.file!=null){
      state.tabs.push({path:opts.file,content:opts.content||'',lang:Syntax.getLang(opts.file),modified:false,savedContent:opts.content||''});
    } else {
      state.tabs.push({path:null,content:'// Neues Dokument\n',lang:'js',modified:false,savedContent:'// Neues Dokument\n'});
    }
    this._renderTabs(id);
    this._activateTab(id,0);
    this._initEvents(id);
    WM.setResize(id,()=>this._syncGutter(id));
    WM.setCleanup(id,()=>{clearTimeout(this._hlTimers[id]);delete this._hlTimers[id];});
  },
  _initEvents(id){
    const ta=document.getElementById('ceta-'+id);
    if(!ta)return;
    const d=WM.getData(id);
    const AUTO={'{':'}','(':')',  '[':']','"':'"',"'":"'",'`':'`'};

    ta.addEventListener('input',()=>this._sync(id));
    ta.addEventListener('scroll',()=>{
      const pre=document.getElementById('cepre-'+id);
      const gut=document.getElementById('cegutter-'+id);
      if(pre){pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;}
      if(gut)gut.scrollTop=ta.scrollTop;
    });
    ta.addEventListener('keydown',e=>{
      const d2=WM.getData(id);if(!d2)return;
      // Ctrl+S
      if(e.ctrlKey&&e.key==='s'){e.preventDefault();this.save(id);return;}
      // Ctrl+/
      if(e.ctrlKey&&e.key==='/'){e.preventDefault();this._toggleComment(id);return;}
      // Ctrl+F
      if(e.ctrlKey&&e.key==='f'){e.preventDefault();this.toggleFind(id);return;}
      // Ctrl+D - duplicate line
      if(e.ctrlKey&&e.key==='d'){e.preventDefault();this._dupLine(id);return;}
      // Tab
      if(e.key==='Tab'){
        e.preventDefault();
        const s=ta.selectionStart,en=ta.selectionEnd;
        if(s===en){this._insert(ta,'  ');}
        else{const b=ta.value.slice(0,s),sel=ta.value.slice(s,en),af=ta.value.slice(en);const ind=e.shiftKey?sel.replace(/^  /gm,''):sel.replace(/^/gm,'  ');ta.value=b+ind+af;ta.selectionStart=s;ta.selectionEnd=s+ind.length;}
        this._sync(id);return;
      }
      // Enter - auto-indent
      if(e.key==='Enter'){
        e.preventDefault();
        const pos=ta.selectionStart;
        const before=ta.value.slice(0,pos);
        const line=before.split('\n').pop();
        const indent=line.match(/^(\s*)/)[1];
        const extra=/[{(\[]\s*$/.test(line)?'  ':'';
        // Auto-close bracket?
        const after=ta.value.slice(ta.selectionEnd);
        const closers=new Set(['}',')' ,']']);
        if(extra&&closers.has(after.trimStart()[0])){
          const closeIndent=indent;
          this._insert(ta,'\n'+indent+extra+'\n'+closeIndent);
          // move cursor to middle line
          ta.selectionStart=ta.selectionEnd=pos+1+indent.length+extra.length;
        } else {
          this._insert(ta,'\n'+indent+extra);
        }
        this._sync(id);return;
      }
      // Auto-close brackets/quotes
      if(AUTO[e.key]){
        const s2=ta.selectionStart,en2=ta.selectionEnd;
        const sel=ta.value.slice(s2,en2);
        if(sel){e.preventDefault();this._insert(ta,e.key+sel+AUTO[e.key]);ta.selectionStart=s2+1;ta.selectionEnd=s2+1+sel.length;this._sync(id);return;}
        // Don't double-close if next char is the closer
        if(ta.value[s2]===AUTO[e.key]&&e.key===AUTO[e.key]){// just move cursor
          e.preventDefault();ta.selectionStart=ta.selectionEnd=s2+1;return;}
      }
      // Backspace - remove pair
      if(e.key==='Backspace'){
        const s2=ta.selectionStart;
        if(s2>0&&ta.selectionStart===ta.selectionEnd){
          const prev=ta.value[s2-1],next=ta.value[s2];
          if(AUTO[prev]===next){e.preventDefault();ta.value=ta.value.slice(0,s2-1)+ta.value.slice(s2+1);ta.selectionStart=ta.selectionEnd=s2-1;this._sync(id);return;}
        }
      }
    });
    ta.addEventListener('keyup',()=>this._updateStatus(id));
    ta.addEventListener('click',()=>this._updateStatus(id));
  },
  _insert(ta,text){
    const s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+text+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=s+text.length;
  },
  // Debounce timers per window
  _hlTimers:{},

  _sync(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);
    const pre=document.getElementById('cepre-'+id);
    if(!ta||!pre)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    tab.content=ta.value;
    tab.modified=tab.content!==tab.savedContent;

    // Update status + gutter immediately (cheap, no regex)
    this._syncGutter(id);
    this._updateStatus(id);
    this._renderTabs(id);

    // Debounce highlighting — wait 120ms after last keystroke
    clearTimeout(this._hlTimers[id]);
    this._hlTimers[id]=setTimeout(()=>this._hlAsync(id, ta.value, tab.lang, d.theme), 120);
  },

  _hlAsync(id, code, lang, theme){
    const pre=document.getElementById('cepre-'+id);if(!pre)return;
    const d=WM.getData(id);if(!d)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    if(tab.content!==code)return; // stale

    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const PLAIN_LIMIT=120000; // never try to highlight > 120KB
    const CHUNK_LIMIT=6000;   // highlight in chunks of N characters

    // No language → just escape
    if(!lang||code.length>PLAIN_LIMIT){
      pre.innerHTML=esc(code)+'\n';
      const st=document.getElementById('cest-chars-'+id);
      if(code.length>PLAIN_LIMIT&&st)
        st.textContent=`${code.length} Zeichen · ${code.split('\n').length} Zeilen · ⚡ Highlighting deaktiviert (Datei zu groß)`;
      this._syncGutter(id);
      return;
    }

    // Split into ~CHUNK_LIMIT char chunks at newline boundaries
    const chunks=[];
    let pos=0;
    while(pos<code.length){
      let end=Math.min(pos+CHUNK_LIMIT, code.length);
      if(end<code.length){
        // snap to last newline so we don't break a token mid-line
        const nl=code.lastIndexOf('\n',end);
        if(nl>pos)end=nl+1;
      }
      chunks.push(code.slice(pos,end));
      pos=end;
    }

    // Mark pre as "highlighting in progress" so user sees something immediately
    if(code.length>CHUNK_LIMIT){
      const st=document.getElementById('cest-chars-'+id);
      if(st)st.textContent=`${code.length} Zeichen · ${code.split('\n').length} Zeilen · ⏳ Highlighting läuft…`;
    }

    // Process chunks one per setTimeout tick so browser stays responsive
    const results=new Array(chunks.length);
    let done=0;
    chunks.forEach((chunk, i)=>{
      setTimeout(()=>{
        // Bail if window closed or content changed
        const pre2=document.getElementById('cepre-'+id);if(!pre2||pre2!==pre)return;
        const d2=WM.getData(id);if(!d2||d2.tabs[d2.cur]?.content!==code)return;
        results[i]=Syntax.hl(chunk, lang, theme);
        done++;
        if(done===chunks.length){
          pre.innerHTML=results.join('')+'\n';
          this._syncGutter(id);
          this._updateStatus(id); // clears the "läuft…" message
        }
      }, i*8); // stagger 8ms apart — fast but yields between each chunk
    });
  },
  _syncGutter(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);
    const gut=document.getElementById('cegutter-'+id);
    if(!ta||!gut)return;
    const lines=ta.value.split('\n').length;
    // Only rebuild if count changed
    if(gut.children.length===lines)return;
    gut.innerHTML=Array.from({length:lines},(_,i)=>`<span>${i+1}</span>`).join('');
  },
  _updateStatus(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);if(!ta)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    const pos=ta.selectionStart;
    const before=ta.value.slice(0,pos);
    const ln=before.split('\n').length;
    const col=before.split('\n').pop().length+1;
    const setT=(sel,txt)=>{const el=document.getElementById(sel);if(el)el.textContent=txt;};
    setT(`cest-pos-${id}`,`Ln ${ln}, Sp ${col}`);
    setT(`cest-file-${id}`,tab.path?tab.path.split('/').pop():'Unbenannt');
    setT(`cest-lang-${id}`,{js:'JavaScript',html:'HTML',css:'CSS',json:'JSON',md:'Markdown',sh:'Shell','':'Plaintext'}[tab.lang]||'Text');
    setT(`cest-chars-${id}`,`${ta.value.length} Zeichen · ${ta.value.split('\n').length} Zeilen`);
  },
  _activateTab(id,idx){
    const d=WM.getData(id);if(!d)return;
    d.cur=idx;
    const tab=d.tabs[idx];if(!tab)return;
    const ta=document.getElementById('ceta-'+id);
    const pre=document.getElementById('cepre-'+id);
    const gut=document.getElementById('cegutter-'+id);
    if(!ta||!pre||!gut)return;
    // Apply theme
    const t=Syntax.themes[d.theme]||Syntax.themes.dracula;
    pre.style.cssText=`background:${t.bg};color:${t.fg}`;
    ta.style.cssText=`background:transparent;caret-color:${t.cur}`;
    gut.style.cssText=`background:${t.gutter};color:${t.gutFg}`;
    // Set language in selector
    const langSel=document.getElementById('celang-'+id);
    if(langSel)langSel.value=tab.lang;
    ta.value=tab.content;
    // Show plain text immediately so editor is usable right away
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    pre.innerHTML=esc(tab.content)+'\n';
    this._syncGutter(id);
    this._updateStatus(id);
    this._renderTabs(id);
    // Then highlight async
    this._hlAsync(id, tab.content, tab.lang, d.theme);
    // Show run button for HTML files
    const runBtn=document.getElementById('cerun-'+id);
    if(runBtn){
      const isHtml=tab.lang==='html'||tab.lang==='htm';
      runBtn.style.display=isHtml?'':'none';
    }
    ta.focus();
  },
  _renderTabs(id){
    const d=WM.getData(id);if(!d)return;
    const bar=document.getElementById('cetabs-'+id);if(!bar)return;
    bar.innerHTML=d.tabs.map((tab,i)=>{
      const name=tab.path?tab.path.split('/').pop():'Unbenannt';
      const modDot=tab.modified?'<span class="dot"></span>':'';
      return `<div class="ce-tab${i===d.cur?' active':''}" onclick="CodeEditorApp._activateTab('${id}',${i})">
        ${modDot}${name}
        <span class="tab-close" onclick="event.stopPropagation();CodeEditorApp.closeTab('${id}',${i})">✕</span>
      </div>`;
    }).join('');
  },
  closeTab(id,idx){
    const d=WM.getData(id);if(!d||d.tabs.length<=1)return;
    if(d.tabs[idx].modified&&!confirm('Ungespeicherte Änderungen verwerfen?'))return;
    d.tabs.splice(idx,1);
    if(d.cur>=d.tabs.length)d.cur=d.tabs.length-1;
    clearTimeout(this._hlTimers[id]);
    this._activateTab(id,d.cur);
  },
  newTab(id){
    const d=WM.getData(id);if(!d)return;
    d.tabs.push({path:null,content:'',lang:'js',modified:false,savedContent:''});
    this._activateTab(id,d.tabs.length-1);
  },
  openFile(id){
    const p=prompt('Dateipfad öffnen:','/home/user/Documents/');
    if(!p)return;
    const c=VFS.read(p);
    if(c===null){OS.notify('❌','Fehler','Datei nicht gefunden');return;}
    const d=WM.getData(id);if(!d)return;
    // Check if already open
    const existing=d.tabs.findIndex(t=>t.path===p);
    if(existing>=0){this._activateTab(id,existing);return;}
    d.tabs.push({path:p,content:c,lang:Syntax.getLang(p),modified:false,savedContent:c});
    this._activateTab(id,d.tabs.length-1);
    OS.notify('📂','Geöffnet',p.split('/').pop());
  },
  openPath(id,path){
    const c=VFS.read(path);if(c===null)return;
    const d=WM.getData(id);if(!d)return;
    const ex=d.tabs.findIndex(t=>t.path===path);
    if(ex>=0){this._activateTab(id,ex);return;}
    d.tabs.push({path,content:c,lang:Syntax.getLang(path),modified:false,savedContent:c});
    this._activateTab(id,d.tabs.length-1);
  },
  save(id){
    const d=WM.getData(id);if(!d)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    if(!tab.path){this.saveAs(id);return;}
    VFS.write(tab.path,tab.content);
    tab.savedContent=tab.content;tab.modified=false;
    this._renderTabs(id);
    OS.notify('💾','Gespeichert',tab.path.split('/').pop());
  },
  saveAs(id){
    const d=WM.getData(id);if(!d)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    const p=prompt('Speichern unter:',tab.path||'/home/user/Documents/neu.js');
    if(!p)return;
    tab.path=p;tab.lang=Syntax.getLang(p);
    VFS.write(p,tab.content);
    tab.savedContent=tab.content;tab.modified=false;
    this._renderTabs(id);
    OS.notify('💾','Gespeichert',p.split('/').pop());
  },
  setTheme(id,theme){
    const d=WM.getData(id);if(!d)return;
    d.theme=theme;
    this._activateTab(id,d.cur);
  },
  setLang(id,lang){
    const d=WM.getData(id);if(!d)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    tab.lang=lang;
    const runBtn=document.getElementById('cerun-'+id);
    if(runBtn)runBtn.style.display=(lang==='html'||lang==='htm')?'':'none';
    this._sync(id);
  },
  run(id){
    const d=WM.getData(id);if(!d)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    if(tab.lang!=='html'&&tab.lang!=='htm')return;
    const html=tab.path?VFS.resolveHTML(tab.path)||tab.content:tab.content;
    OS.openApp('browser',{srcdoc:html,title:tab.path?tab.path.split('/').pop():'Vorschau'});
  },
  run_from_path(id,path){
    const html=VFS.resolveHTML(path);
    if(!html){OS.notify('❌','Fehler','Datei nicht gefunden');return;}
    OS.openApp('browser',{srcdoc:html,title:path.split('/').pop()});
  },
  toggleFind(id){
    const d=WM.getData(id);if(!d)return;
    d.findOpen=!d.findOpen;
    const bar=document.getElementById('cefind-'+id);
    if(bar)bar.classList.toggle('hidden',!d.findOpen);
    if(d.findOpen)document.getElementById('cefindinp-'+id)?.focus();
  },
  findNext(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);
    const inp=document.getElementById('cefindinp-'+id);
    if(!ta||!inp)return;
    const q=inp.value;if(!q)return;
    const text=ta.value;
    const start=ta.selectionEnd||0;
    const idx=text.indexOf(q,start);
    if(idx>=0){ta.selectionStart=idx;ta.selectionEnd=idx+q.length;ta.focus();}
    else{const idx2=text.indexOf(q);if(idx2>=0){ta.selectionStart=idx2;ta.selectionEnd=idx2+q.length;ta.focus();}else OS.notify('🔍','Suchen','Nicht gefunden');}
  },
  findKey(id,e){if(e.key==='Enter')this.findNext(id);if(e.key==='Escape')this.toggleFind(id);},
  replaceCurrent(id){
    const ta=document.getElementById('ceta-'+id);
    const ri=document.getElementById('cereplceinp-'+id);
    const fi=document.getElementById('cefindinp-'+id);
    if(!ta||!ri||!fi)return;
    const s=ta.selectionStart,en=ta.selectionEnd;
    if(ta.value.slice(s,en)===fi.value){ta.value=ta.value.slice(0,s)+ri.value+ta.value.slice(en);ta.selectionStart=s;ta.selectionEnd=s+ri.value.length;this._sync(id);}
    this.findNext(id);
  },
  replaceAll(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);
    const ri=document.getElementById('cereplceinp-'+id);
    const fi=document.getElementById('cefindinp-'+id);
    if(!ta||!ri||!fi||!fi.value)return;
    const count=(ta.value.split(fi.value).length-1);
    ta.value=ta.value.split(fi.value).join(ri.value);
    const tab=d.tabs[d.cur];if(tab){tab.content=ta.value;tab.modified=tab.content!==tab.savedContent;}
    this._sync(id);
    OS.notify('🔍','Ersetzen',`${count} Vorkommen ersetzt`);
  },
  _toggleComment(id){
    const d=WM.getData(id);if(!d)return;
    const ta=document.getElementById('ceta-'+id);if(!ta)return;
    const tab=d.tabs[d.cur];if(!tab)return;
    const s=ta.selectionStart,en=ta.selectionEnd;
    const text=ta.value;
    const lineS=text.lastIndexOf('\n',s-1)+1;
    const lineE=text.indexOf('\n',en);
    const end2=lineE===-1?text.length:lineE;
    const lines=text.slice(lineS,end2).split('\n');
    const prefix=tab.lang==='css'?'/* ':tab.lang==='html'?'<!-- ':'// ';
    const suffix=tab.lang==='css'?' */':tab.lang==='html'?' -->':'';
    const allComm=lines.every(l=>l.trim().startsWith(prefix.trim()));
    const newLines=allComm?lines.map(l=>l.replace(prefix.trim(),'').replace(suffix.trim(),'')):lines.map(l=>prefix+l+suffix);
    ta.value=text.slice(0,lineS)+newLines.join('\n')+text.slice(end2);
    ta.selectionStart=lineS;ta.selectionEnd=lineS+newLines.join('\n').length;
    this._sync(id);
  },
  _dupLine(id){
    const ta=document.getElementById('ceta-'+id);if(!ta)return;
    const pos=ta.selectionStart;
    const text=ta.value;
    const lineS=text.lastIndexOf('\n',pos-1)+1;
    const lineE=text.indexOf('\n',pos);
    const end2=lineE===-1?text.length:lineE;
    const line=text.slice(lineS,end2);
    ta.value=text.slice(0,end2)+'\n'+line+text.slice(end2);
    ta.selectionStart=ta.selectionEnd=end2+1+line.length;
    this._sync(id);
  }
};

      <div style="width:200px;height:4px;background:rgba(100,180,255,.2);border-radius:2px;overflow:hidden"><div id="brprogbar-${id}" style="height:100%;background:linear-gradient(90deg,#3a9de0,#50d0ff);width:0;border-radius:2px;transition:width .4s"></div></div>
    </div>
    <iframe class="br-iframe" id="brframe-${id}" style="display:none;border:none;flex:1;width:100%;background:#fff"></iframe>
    <div class="br-home" id="brhome-${id}" style="display:none"></div>
    <div id="brerr-${id}" style="display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(240,250,255,.95);padding:30px;text-align:center"></div>
    <div style="padding:2px 10px;font-size:10px;color:var(--text3);background:rgba(175,215,255,.7);border-top:1px solid rgba(100,170,230,.2);flex-shrink:0;display:flex;gap:12px">
      <span id="brstatus-${id}">Bereit</span>
      <span id="brmode-${id}" style="margin-left:auto"></span>
    </div>`;
  },

  init(id, opts={}){
    WM.setData(id,{history:[],histIdx:-1,loading:false});
    // Build bookmarks bar
    const bm=document.getElementById('brbm-'+id);
    if(bm) this.BOOKMARKS.forEach(b=>{
      const btn=document.createElement('button');
      btn.className='tbut';btn.style.cssText='font-size:11px;display:flex;align-items:center;gap:4px;padding:2px 8px';
      btn.innerHTML=`${b.icon} ${b.label}`;
      btn.onclick=()=>BrowserApp._loadURL(id,b.url);
      bm.appendChild(btn);
    });
    if(opts.srcdoc!=null) this._loadSrcdoc(id,opts.srcdoc,opts.title||'Vorschau');
    else if(opts.url) this._loadURL(id,opts.url);
    else this._showHome(id);
  },

  _panels(id){
    return {
      frame: document.getElementById('brframe-'+id),
      home:  document.getElementById('brhome-'+id),
      load:  document.getElementById('brload-'+id),
      err:   document.getElementById('brerr-'+id),
    };
  },
  _hideAll(id){
    const p=this._panels(id);
    Object.values(p).forEach(el=>{if(el)el.style.display='none';});
  },
  _setStatus(id,txt,mode=''){
    const s=document.getElementById('brstatus-'+id);const m=document.getElementById('brmode-'+id);
    if(s)s.textContent=txt;if(m)m.textContent=mode;
  },
  _setTitle(id,title){
    document.querySelectorAll('.win').forEach(w=>{
      if(w.id.includes(id)){const t=w.querySelector('.ttl');if(t)t.textContent=`🌐 ${title}`;}
    });
  },
  _progress(id,pct){
    const b=document.getElementById('brprogbar-'+id);if(b)b.style.width=pct+'%';
  },

  _showHome(id){
    this._hideAll(id);
    const p=this._panels(id);if(p.home)p.home.style.display='block';
    const urlEl=document.getElementById('brurl-'+id);if(urlEl)urlEl.value='aeroos://home';
    const editBtn=document.getElementById('br-edit-'+id);if(editBtn)editBtn.style.display='none';
    const sslEl=document.getElementById('brssl-'+id);if(sslEl)sslEl.textContent='';
    this._setTitle(id,'AeroBrowser');
    this._setStatus(id,'Startseite','AeroOS VFS');

    const htmlFiles=VFS.findHTML();
    const groups={};
    htmlFiles.forEach(f=>{const dir=f.slice(0,f.lastIndexOf('/'));if(!groups[dir])groups[dir]=[];groups[dir].push(f);});

    let html=`<h2 style="font-size:15px;color:var(--accent);margin-bottom:12px">🌐 AeroBrowser</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-bottom:18px">
      ${this.BOOKMARKS.map(b=>`<div onclick="BrowserApp._loadURL('${id}','${b.url}')" style="cursor:pointer;text-align:center;padding:10px 6px;border-radius:10px;background:rgba(100,185,255,.12);border:1px solid rgba(100,185,255,.25);transition:background .1s" onmouseover="this.style.background='rgba(100,185,255,.25)'" onmouseout="this.style.background='rgba(100,185,255,.12)'">
        <div style="font-size:24px;margin-bottom:4px">${b.icon}</div>
        <div style="font-size:10px;color:var(--text2)">${b.label}</div>
      </div>`).join('')}
    </div>
    <div style="padding:8px 12px;background:rgba(100,185,255,.12);border-radius:8px;font-size:12px;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span>💡</span> Jede URL wird via CORS-Proxy geladen. VFS-Dateien mit <code>/pfad/datei.html</code> öffnen.
    </div>
    <h2 style="font-size:13px;color:var(--accent);margin-bottom:8px">📁 Meine HTML-Projekte</h2>`;

    Object.entries(groups).forEach(([dir,files])=>{
      html+=`<div style="margin-top:8px;font-size:10px;font-weight:700;color:var(--text3);padding-bottom:3px;border-bottom:1px solid rgba(100,165,225,.2);margin-bottom:4px">${dir}/</div>`;
      files.forEach(f=>{
        const name=f.split('/').pop();
        html+=`<div class="br-file" onclick="BrowserApp.loadVFS('${id}','${f}')">
          <span>🌐</span>
          <div style="flex:1"><div style="font-weight:600;font-size:12px">${name}</div><div style="font-size:10px;color:var(--text3)">${f}</div></div>
          <button class="tbut" style="font-size:10px" onclick="event.stopPropagation();OS.openApp('codeeditor',{file:'${f}',content:VFS.read('${f}')})">📝</button>
        </div>`;
      });
    });
    if(htmlFiles.length===0)html+=`<div style="color:var(--text3);font-size:12px;padding:10px 0">Keine HTML-Dateien. Erstelle im Code Editor ein Projekt!</div>`;
    p.home.innerHTML=html;
  },

  go(id){
    let url=(document.getElementById('brurl-'+id)?.value||'').trim();
    if(!url)return;
    if(url.startsWith('/')) { this.loadVFS(id,url); return; }
    if(url==='aeroos://home') { this._showHome(id); return; }
    // Special: redirect claude.ai to built-in chat
    if(url.includes('claude.ai')||url==='claude') { OS.openApp('claudechat',{}); return; }
    if(!url.startsWith('http')) {
      if(url.includes(' ')||!url.includes('.'))
        url='https://www.google.com/search?q='+encodeURIComponent(url);
      else
        url='https://'+url;
    }
    this._loadURL(id,url);
  },

  loadVFS(id,path){
    const html=VFS.resolveHTML(path);
    if(!html){OS.notify('❌','Fehler',`${path.split('/').pop()} nicht gefunden`);return;}
    const d=WM.getData(id);
    if(d){d.history=d.history.slice(0,d.histIdx+1);d.history.push({type:'vfs',path,html});d.histIdx=d.history.length-1;}
    this._loadSrcdoc(id,html,path.split('/').pop());
    const urlEl=document.getElementById('brurl-'+id);if(urlEl)urlEl.value=path;
    const editBtn=document.getElementById('br-edit-'+id);if(editBtn)editBtn.style.display='';
    const sslEl=document.getElementById('brssl-'+id);if(sslEl)sslEl.textContent='';
    this._setStatus(id,'VFS-Datei','Lokal');
  },

  _loadSrcdoc(id,html,title){
    this._hideAll(id);
    const frame=document.getElementById('brframe-'+id);
    if(!frame)return;
    frame.style.cssText='display:block;border:none;flex:1;width:100%;background:#fff';
    frame.srcdoc=html;
    this._setTitle(id,title||'AeroBrowser');
  },

  async _loadURL(id,url){
    if(!url.startsWith('http'))url='https://'+url;
    const d=WM.getData(id);
    if(d){d.history=d.history.slice(0,d.histIdx+1);d.history.push({type:'url',url});d.histIdx=d.history.length-1;d.loading=true;}

    // Show loading panel
    this._hideAll(id);
    const load=document.getElementById('brload-'+id);
    if(load)load.style.display='flex';
    const urlEl=document.getElementById('brurl-'+id);if(urlEl)urlEl.value=url;
    const editBtn=document.getElementById('br-edit-'+id);if(editBtn)editBtn.style.display='none';
    const loadtxt=document.getElementById('brloadtxt-'+id);
    const sslEl=document.getElementById('brssl-'+id);
    this._setStatus(id,'Verbinde…',new URL(url).hostname);
    this._progress(id,10);

    const hostname=new URL(url).hostname;
    const isHttps=url.startsWith('https');
    if(sslEl)sslEl.innerHTML=isHttps?'<span style="color:#50d0a0">🔒</span>':'<span style="color:#ffcc40">🔓</span>';

    try {
      if(loadtxt)loadtxt.textContent=`Lade ${hostname}…`;
      this._progress(id,20);

      // Try each proxy in order until one succeeds
      let html=null, lastErr=null;
      for(let i=0;i<this.PROXIES.length;i++){
        const proxyUrl=this.PROXIES[i](url);
        if(loadtxt)loadtxt.textContent=`Proxy ${i+1}/${this.PROXIES.length}: ${hostname}…`;
        this._progress(id, 20 + i*15);
        try{
          const resp=await fetch(proxyUrl);
          if(!resp.ok) throw new Error('HTTP '+resp.status);
          html=await resp.text();
          if(html&&html.length>100) break; // success
          throw new Error('Leere Antwort');
        } catch(e){ lastErr=e; continue; }
      }
      if(!html) throw lastErr||new Error('Alle Proxies fehlgeschlagen');
      this._progress(id,75);
      if(loadtxt)loadtxt.textContent='Verarbeite Seite…';

      // Inject base tag so relative resources resolve to original domain
      const origin=new URL(url).origin+'/';
      const basePath=url.slice(0,url.lastIndexOf('/')+1);
      // Insert <base> right after <head> or at start
      if(/<head[\s>]/i.test(html)){
        html=html.replace(/(<head[^>]*>)/i,`$1<base href="${basePath}">`);
      } else {
        html=`<base href="${basePath}">${html}`;
      }

      // Extract title for tab
      const titleMatch=html.match(/<title[^>]*>([^<]{0,80})/i);
      const pageTitle=titleMatch?titleMatch[1].trim():hostname;

      // Store HTML in history for reload/back
      if(d&&d.history[d.histIdx])d.history[d.histIdx].html=html;

      this._progress(id,100);
      this._setStatus(id,'Bereit',hostname);
      this._setTitle(id,pageTitle.slice(0,40)||(hostname));

      // Small delay so progress bar finishes
      await new Promise(r=>setTimeout(r,200));
      this._hideAll(id);
      const frame=document.getElementById('brframe-'+id);
      if(frame){
        frame.style.cssText='display:block;border:none;flex:1;width:100%;background:#fff';
        frame.srcdoc=html;
      }
      if(d)d.loading=false;

    } catch(err) {
      this._hideAll(id);
      const errEl=document.getElementById('brerr-'+id);
      if(errEl){
        errEl.style.display='flex';
        errEl.innerHTML=`
          <div style="font-size:48px;margin-bottom:8px">🚫</div>
          <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">Seite nicht erreichbar</div>
          <div style="font-size:12px;color:var(--text3);max-width:320px;margin-bottom:16px">${hostname} konnte nicht geladen werden.<br>Fehler: ${err.message}</div>
          <div style="display:flex;gap:8px">
            <button class="tbut" onclick="BrowserApp._loadURL('${id}','${url}')">↻ Erneut versuchen</button>
            <button class="tbut" onclick="BrowserApp._showHome('${id}')">🏠 Startseite</button>
          </div>
          <div style="margin-top:16px;font-size:11px;color:var(--text3);background:rgba(255,200,100,.1);padding:8px 12px;border-radius:6px;border:1px solid rgba(255,200,100,.3)">
            💡 Einige Seiten blockieren den Proxy-Zugriff.<br>Versuche eine andere URL oder direkt im Browser öffnen.
          </div>`;
      }
      this._setStatus(id,'Fehler beim Laden',hostname);
      if(d)d.loading=false;
    }
  },

  back(id){
    const d=WM.getData(id);if(!d||d.histIdx<=0)return;
    d.histIdx--;
    const h=d.history[d.histIdx];if(!h)return;
    if(h.type==='vfs') this.loadVFS(id,h.path);
    else if(h.html) { // cached
      this._hideAll(id);
      const frame=document.getElementById('brframe-'+id);
      if(frame){frame.style.cssText='display:block;border:none;flex:1;width:100%;background:#fff';frame.srcdoc=h.html;}
      const urlEl=document.getElementById('brurl-'+id);if(urlEl)urlEl.value=h.url;
      this._setStatus(id,'Bereit',new URL(h.url).hostname);
    } else this._loadURL(id,h.url);
  },

  fwd(id){
    const d=WM.getData(id);if(!d||d.histIdx>=d.history.length-1)return;
    d.histIdx++;
    const h=d.history[d.histIdx];if(!h)return;
    if(h.type==='vfs') this.loadVFS(id,h.path);
    else if(h.html){
      this._hideAll(id);
      const frame=document.getElementById('brframe-'+id);
      if(frame){frame.style.cssText='display:block;border:none;flex:1;width:100%;background:#fff';frame.srcdoc=h.html;}
      const urlEl=document.getElementById('brurl-'+id);if(urlEl)urlEl.value=h.url;
    } else this._loadURL(id,h.url);
  },

  reload(id){
    const d=WM.getData(id);if(!d)return;
    const h=d.history[d.histIdx];if(!h)return;
    if(h.type==='vfs') this.loadVFS(id,h.path);
    else this._loadURL(id,h.url);
  },

  home(id){ this._showHome(id); },

  openInEditor(id){
    const d=WM.getData(id);if(!d)return;
    const h=d.history[d.histIdx];
    if(h?.type==='vfs') OS.openApp('codeeditor',{file:h.path,content:VFS.read(h.path)||''});
    else OS.notify('📝','Editor','Nur VFS-Dateien können bearbeitet werden');
  }
};
