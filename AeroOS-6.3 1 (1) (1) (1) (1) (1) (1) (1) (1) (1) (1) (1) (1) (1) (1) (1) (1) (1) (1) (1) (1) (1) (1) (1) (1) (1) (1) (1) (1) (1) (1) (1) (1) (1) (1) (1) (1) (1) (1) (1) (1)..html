const TerminalApp = {
  id:'terminal', title:'Terminal', icon:'🖥️', w:560, h:400,
  html(id){
    return `<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;background:rgba(4,12,32,0.97)">
      <div class="term-out" id="to-${id}"></div>
      <div class="term-in-row">
        <span class="term-prompt" id="tp-${id}">user@aeroos:~$</span>
        <div id="tinput-holder"><input id="ti-${id}" type="text" autocomplete="off" spellcheck="false" style="width:100%;background:transparent;border:none;outline:none;color:#c8e8ff;font-family:Consolas,monospace;font-size:12px;caret-color:#80ffcc;user-select:text;-webkit-user-select:text"></div>
      </div></div>`;
  },
  init(id){
    const state={cwd:'/home/user',history:[],histIdx:-1};
    WM.setData(id,state);
    const out=document.getElementById('to-'+id);
    const inp=document.getElementById('ti-'+id);
    const pr=document.getElementById('tp-'+id);
    function write(html){out.innerHTML+=html+'<br>';out.scrollTop=9999;}
    function prompt(){const p=state.cwd.replace('/home/user','~');pr.textContent=`user@aeroos:${p}$`;}
    write('<span class="thl">AeroOS Terminal 6.2</span>');
    write('<span class="twarn">Tippe "help" für Befehle. "nano [pfad]" öffnet den Code Editor.</span>');
    write('');
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){const cmd=inp.value.trim();inp.value='';if(cmd){state.history.unshift(cmd);state.histIdx=-1;}write(`<span class="thl">${pr.textContent}</span> <span class="tcmd">${esc(cmd)}</span>`);if(cmd)execCmd(cmd,write,state,prompt,id);prompt();}
      else if(e.key==='ArrowUp'){state.histIdx=Math.min(state.histIdx+1,state.history.length-1);if(state.history[state.histIdx]!=null)inp.value=state.history[state.histIdx];}
      else if(e.key==='ArrowDown'){state.histIdx=Math.max(state.histIdx-1,-1);inp.value=state.histIdx>=0?state.history[state.histIdx]:'';}
      else if(e.key==='Tab'){e.preventDefault();tabComplete(inp,state);}
      else if(e.ctrlKey&&e.key==='c'){inp.value='';write('^C');}
      else if(e.ctrlKey&&e.key==='l'){out.innerHTML='';}
    });
    document.getElementById('to-'+id).addEventListener('click',()=>inp.focus());
    inp.focus();prompt();
  }
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tabComplete(inp,state){
  const parts=inp.value.split(' ');const last=parts[parts.length-1];
  const dir=last.includes('/')?VFS.resolve(last.slice(0,last.lastIndexOf('/')+1),state.cwd):state.cwd;
  const prefix=last.includes('/')?last.slice(last.lastIndexOf('/')+1):last;
  const items=(VFS.list(dir)||[]).filter(f=>f.name.startsWith(prefix));
  if(items.length===1){parts[parts.length-1]=(last.slice(0,last.length-prefix.length))+items[0].name+(items[0].type==='dir'?'/':'');inp.value=parts.join(' ');}
}

function execCmd(line,write,state,promptFn,wid){
  const tokens=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];
  const[cmd,...args]=tokens.map(t=>t.replace(/^['"]|['"]$/g,''));
  const res=p=>VFS.resolve(p,state.cwd);
  switch(cmd){
    case 'help':case '?':
      write('<span class="thl">Befehle:</span>');
      ['ls [-la]   Verzeichnis auflisten','cd [pfad]   Verzeichnis wechseln','cat [datei]  Datei anzeigen','echo [text] [> datei]  Text ausgeben/schreiben',
       'mkdir [pfad]  Ordner erstellen','touch [datei]  Datei erstellen','rm [-r] [pfad]  Löschen','mv src dst  Verschieben',
       'cp src dst  Kopieren','nano [datei]  Code Editor öffnen','browser [pfad]  Browser öffnen','tree  Verzeichnisbaum',
       'find [-name x]  Suchen','grep muster datei  Suchen','wc [datei]  Statistik','head/tail [-n] [datei]  Anfang/Ende',
       'pwd  Aktueller Pfad','whoami  Benutzer','uname [-a]  System','date  Datum','clear  Leeren'].forEach(b=>{
        const[t,...r]=b.split('  ');write(`  <span class="tcmd">${t}</span>  ${r.join('  ')}`);});
      break;
    case 'pwd':write(state.cwd);break;
    case 'whoami':write('user');break;
    case 'uname':write(args.includes('-a')?'AeroOS 6.2.0 aeroos-pc x86_64 AeroKernel':'AeroOS');break;
    case 'date':write(new Date().toLocaleString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}));break;
    case 'clear':document.getElementById('to-'+wid).innerHTML='';break;
    case 'cd':{const np=res(args[0]||'/home/user');if(VFS.type(np)==='dir')state.cwd=np;else write(`<span class="terr">cd: ${esc(args[0]||'')}: Nicht gefunden</span>`);break;}
    case 'ls':{
      const showHidden=args.some(a=>a.includes('a'));const long=args.some(a=>a.includes('l'));
      const pa=args.filter(a=>!a.startsWith('-'))[0];const p=pa?res(pa):state.cwd;
      const items=VFS.list(p);if(!items){write(`<span class="terr">ls: ${esc(p)}: Kein Verzeichnis</span>`);break;}
      const show=items.filter(f=>showHidden||!f.name.startsWith('.'));
      if(long)show.forEach(f=>{const perm=f.type==='dir'?'drwxr-xr-x':'-rw-r--r--';const sz=String(f.size||0).padStart(6);const dt=new Date(f.modified||Date.now()).toLocaleDateString('de-DE');write(`${perm} user user ${sz} ${dt} ${f.type==='dir'?`<span class="tdir">${esc(f.name)}/</span>`:`<span class="tfile">${esc(f.name)}</span>`}`);});
      else{const cols=show.map(f=>f.type==='dir'?`<span class="tdir">${esc(f.name)}/</span>`:`<span class="tfile">${esc(f.name)}</span>`);write(cols.join('  '));}
      break;}
    case 'cat':{if(!args[0]){write('<span class="terr">cat: Name fehlt</span>');break;}const c=VFS.read(res(args[0]));if(c===null){write(`<span class="terr">cat: ${esc(args[0])}: Nicht gefunden</span>`);break;}c.split('\n').forEach(l=>write(esc(l)));break;}
    case 'echo':{const ri=args.indexOf('>');const ri2=args.indexOf('>>');if(ri>0){const txt=args.slice(0,ri).join(' ');VFS.write(res(args[ri+1]),txt);write(`<span class="tok">→ ${esc(args[ri+1])}</span>`);}else if(ri2>0){const txt=args.slice(0,ri2).join(' ');const old=VFS.read(res(args[ri2+1]))||'';VFS.write(res(args[ri2+1]),old+(old?'\n':'')+txt);write(`<span class="tok">+→ ${esc(args[ri2+1])}</span>`);}else write(esc(args.join(' ')));break;}
    case 'mkdir':{if(!args[0]){write('<span class="terr">mkdir: Name fehlt</span>');break;}if(VFS.mkdir(res(args[0])))write(`<span class="tok">Erstellt: ${esc(args[0])}</span>`);else write(`<span class="terr">mkdir: Fehler</span>`);break;}
    case 'touch':{if(!args[0]){write('<span class="terr">touch: Name fehlt</span>');break;}const p2=res(args[0]);if(!VFS.exists(p2)){VFS.write(p2,'');write(`<span class="tok">Erstellt: ${esc(args[0])}</span>`);}else write(`${esc(args[0])}: existiert bereits`);break;}
    case 'rm':{const rec=args.includes('-r')||args.includes('-rf');const f=args.filter(a=>!a.startsWith('-'))[0];if(!f){write('<span class="terr">rm: Name fehlt</span>');break;}const p2=res(f);if(!VFS.exists(p2)){write(`<span class="terr">rm: ${esc(f)}: Nicht gefunden</span>`);break;}if(VFS.type(p2)==='dir'&&!rec){write(`<span class="terr">rm: ${esc(f)}: Nutze -r</span>`);break;}if(VFS.rm(p2))write(`<span class="tok">Gelöscht: ${esc(f)}</span>`);break;}
    case 'mv':{if(args.length<2){write('<span class="terr">mv: Quelle und Ziel angeben</span>');break;}if(VFS.mv(res(args[0]),res(args[1])))write(`<span class="tok">Verschoben</span>`);else write('<span class="terr">mv: Fehler</span>');break;}
    case 'cp':{if(args.length<2){write('<span class="terr">cp: Quelle und Ziel angeben</span>');break;}if(VFS.cp(res(args[0]),res(args[1])))write(`<span class="tok">Kopiert</span>`);else write('<span class="terr">cp: Fehler</span>');break;}
    case 'nano':case 'vi':case 'vim':case 'code':{const f=args[0]?res(args[0]):null;if(f){const c=VFS.read(f);OS.openApp('codeeditor',{file:f,content:c!==null?c:''});write(`<span class="tok">Editor: ${esc(f)}</span>`);}else{OS.openApp('codeeditor',{});write('<span class="tok">Editor geöffnet</span>');}break;}
    case 'browser':case 'open':{const f=args[0];if(f&&f.endsWith('.html')){OS.openApp('browser',{});setTimeout(()=>{const wins=Object.keys(WM);},100);}else OS.openApp('browser',{});break;}
    case 'tree':{const p2=args[0]?res(args[0]):state.cwd;write(`<span class="tdir">${esc(p2)}</span>`);function tr(path,pfx=''){const items=VFS.list(path)||[];items.forEach((f,i)=>{const last=i===items.length-1;const fp=(path==='/'?'':path)+'/'+f.name;write(pfx+(last?'└── ':'├── ')+(f.type==='dir'?`<span class="tdir">${esc(f.name)}/</span>`:`<span class="tfile">${esc(f.name)}</span>`));if(f.type==='dir')tr(fp,pfx+(last?'    ':'│   '));});}tr(p2);break;}
    case 'find':{const ni=args.indexOf('-name');const pat=ni>=0?args[ni+1]:'';const sp=res(args.filter(a=>!a.startsWith('-'))[0]||state.cwd);function fnd(p){const items=VFS.list(p)||[];items.forEach(f=>{const fp=(p==='/'?'':p)+'/'+f.name;if(!pat||f.name.includes(pat.replace(/\*/g,'')))write(esc(fp));if(f.type==='dir')fnd(fp);});}fnd(sp);break;}
    case 'grep':{if(args.length<2){write('<span class="terr">grep: Muster Datei</span>');break;}const pat=args[0];const c=VFS.read(res(args[1]));if(!c){write(`<span class="terr">grep: ${esc(args[1])}: Nicht gefunden</span>`);break;}let found=false;c.split('\n').forEach((l,i)=>{if(l.toLowerCase().includes(pat.toLowerCase())){write(`<span class="twarn">${i+1}:</span> ${esc(l)}`);found=true;}});if(!found)write('<span class="twarn">Keine Treffer</span>');break;}
    case 'wc':{if(!args[0]){write('<span class="terr">wc: Datei fehlt</span>');break;}const c=VFS.read(res(args[0]));if(!c){write(`<span class="terr">wc: Nicht gefunden</span>`);break;}write(`${c.split('\n').length} Zeilen  ${c.split(/\s+/).filter(Boolean).length} Wörter  ${c.length} Zeichen`);break;}
    case 'head':{const n=parseInt(args.find(a=>a.startsWith('-'))?.slice(1))||10;const fp=res(args.filter(a=>!a.startsWith('-'))[0]);const c=VFS.read(fp);if(!c){write('<span class="terr">head: Nicht gefunden</span>');break;}c.split('\n').slice(0,n).forEach(l=>write(esc(l)));break;}
    case 'tail':{const n=parseInt(args.find(a=>a.startsWith('-'))?.slice(1))||10;const fp=res(args.filter(a=>!a.startsWith('-'))[0]);const c=VFS.read(fp);if(!c){write('<span class="terr">tail: Nicht gefunden</span>');break;}c.split('\n').slice(-n).forEach(l=>write(esc(l)));break;}
    case 'history':state.history.forEach((h,i)=>write(`  <span class="tcmd">${state.history.length-i}</span>  ${esc(h)}`));break;
    case '':break;
    default:write(`<span class="terr">${esc(cmd)}: Nicht gefunden. Tippe "help"</span>`);
  }
}

const FileManagerApp = {
  id:'filemanager', title:'Datei-Manager', icon:'📁', w:540, h:420,
  html(id){
    return `<div class="fm-nav"><button class="tbut" onclick="FileManagerApp.back('${id}')">◀</button><button class="tbut" onclick="FileManagerApp.up('${id}')">▲</button><input class="fm-addr" id="fmaddr-${id}" value="/home/user" onkeydown="if(event.key==='Enter')FileManagerApp.nav('${id}',this.value)"><button class="tbut" onclick="FileManagerApp.mkdir('${id}')">📁 Neu</button><button class="tbut" onclick="FileManagerApp.del('${id}')">🗑</button></div>
    <div class="fm-grid" id="fmgrid-${id}"></div>
    <div class="fm-status" id="fmstat-${id}">0 Elemente</div>`;
  },
  init(id,opts={}){WM.setData(id,{cwd:opts.path||'/home/user',history:[opts.path||'/home/user'],histIdx:0,sel:null});this.refresh(id);},
  refresh(id){
    const d=WM.getData(id);if(!d)return;
    const grid=document.getElementById('fmgrid-'+id);const addr=document.getElementById('fmaddr-'+id);const stat=document.getElementById('fmstat-'+id);
    if(!grid)return;
    addr.value=d.cwd;
    const items=VFS.list(d.cwd)||[];
    const imap={txt:'📄',js:'📜',conf:'⚙️',log:'📋',m3u:'🎵',css:'🎨',html:'🌐',json:'📊',sh:'⚡',md:'📖',png:'🖼️',jpg:'🖼️'};
    grid.innerHTML='';
    if(items.length===0){grid.innerHTML='<div style="padding:20px;color:var(--text3);font-size:12px">Leer</div>';stat.textContent='0 Elemente';return;}
    items.forEach(f=>{
      const ext=f.name.split('.').pop().toLowerCase();
      const ico=f.type==='dir'?'📁':(imap[ext]||'📄');
      const div=document.createElement('div');div.className='fm-item';
      div.innerHTML=`<span class="fm-ico">${ico}</span><span class="fm-nm">${f.name}</span>`;
      const fp=(d.cwd==='/'?'':d.cwd)+'/'+f.name;
      div.onclick=()=>{document.querySelectorAll(`#fmgrid-${id} .fm-item`).forEach(x=>x.classList.remove('sel'));div.classList.add('sel');d.sel=fp;stat.textContent=`${f.name} · ${f.type==='dir'?'Ordner':(f.size||0)+' Byte'}`;};
      div.ondblclick=()=>{
        if(f.type==='dir')this.nav(id,fp);
        else{const c=VFS.read(fp);if(c!==null){if(f.name.endsWith('.html'))OS.openApp('browser',{});else OS.openApp('codeeditor',{file:fp,content:c});}else OS.notify('❌','Fehler','Kann nicht öffnen');}
      };
      div.addEventListener('contextmenu',e=>{
        e.preventDefault();e.stopPropagation();
        document.querySelectorAll(`#fmgrid-${id} .fm-item`).forEach(x=>x.classList.remove('sel'));
        div.classList.add('sel');d.sel=fp;
        const items=[
          {label:'📂 Öffnen',fn:`()=>FileManagerApp._openItem('${id}','${fp}','${f.type}')`},
          {label:'📝 Im Editor öffnen',fn:`()=>OS.openApp('codeeditor',{file:'${fp}',content:VFS.read('${fp}')||''})`},
        ];
        if(f.name.endsWith('.html'))items.push({label:'🌐 Im Browser öffnen',fn:`()=>OS.openApp('browser',{srcdoc:VFS.resolveHTML('${fp}'),title:'${f.name}'})`});
        items.push('-');
        items.push({label:'📋 Umbenennen',fn:`()=>FileManagerApp.rename('${id}','${fp}')`});
        items.push({label:'🗑 In Papierkorb',fn:`()=>FileManagerApp.trash('${id}','${fp}')`});
        OS.showCtx(e.clientX,e.clientY,items);
      });
      grid.appendChild(div);
    });
    stat.textContent=`${items.length} Element${items.length!==1?'e':''}`;
  },
  nav(id,path){const d=WM.getData(id);if(!d)return;const np=VFS.resolve(path,d.cwd);if(VFS.type(np)!=='dir'){OS.notify('❌','Fehler','Kein Ordner');return;}d.history=d.history.slice(0,d.histIdx+1);d.history.push(np);d.histIdx=d.history.length-1;d.cwd=np;d.sel=null;this.refresh(id);},
  back(id){const d=WM.getData(id);if(!d||d.histIdx<=0)return;d.histIdx--;d.cwd=d.history[d.histIdx];d.sel=null;this.refresh(id);},
  up(id){const d=WM.getData(id);if(!d)return;const p=d.cwd.split('/').filter(Boolean);if(!p.length)return;p.pop();this.nav(id,'/'+p.join('/'));},
  mkdir(id){const d=WM.getData(id);if(!d)return;const n=prompt('Ordnername:');if(!n)return;const p=(d.cwd==='/'?'':d.cwd)+'/'+n;if(VFS.mkdir(p))this.refresh(id);else OS.notify('❌','Fehler','Fehler');},
  del(id){const d=WM.getData(id);if(!d||!d.sel)return;if(!confirm(`In Papierkorb: ${d.sel}?`))return;if(RecycleBin.delete(d.sel)){d.sel=null;this.refresh(id);OS.notify('🗑️','Papierkorb','Datei verschoben');}else OS.notify('❌','Fehler','');},
  trash(id,fp){if(RecycleBin.delete(fp)){const d=WM.getData(id);if(d&&d.sel===fp)d.sel=null;this.refresh(id);OS.notify('🗑️','Papierkorb','Datei verschoben');}},
  rename(id,fp){const newName=prompt('Neuer Name:',fp.split('/').pop());if(!newName)return;const dir=fp.slice(0,fp.lastIndexOf('/'));const newPath=dir+'/'+newName;if(VFS.mv(fp,newPath)){this.refresh(id);OS.notify('✏️','Umbenannt',newName);}else OS.notify('❌','Fehler','Umbenennen fehlgeschlagen');},
  _openItem(id,fp,type){if(type==='dir')this.nav(id,fp);else{const c=VFS.read(fp);if(c!==null)OS.openApp('codeeditor',{file:fp,content:c});}}
};

const CalculatorApp = {
  id:'calculator', title:'Rechner', icon:'🔢', w:300, h:420,
  html(id){
    const B=[['C','cl'],['±','op'],['+/-','op'],['÷','op'],['sin','fn'],['7','num'],['8','num'],['9','num'],['×','op'],['cos','fn'],['4','num'],['5','num'],['6','num'],['−','op'],['tan','fn'],['1','num'],['2','num'],['3','num'],['+','op'],['ln','fn'],['0','num span2'],['.','num'],['=','eq'],['√','fn'],['(','op'],[')',  'op'],['%','op'],['π','fn'],['e','fn']];
    return `<div class="calc-body"><div class="calc-disp"><div class="calc-expr" id="ce-${id}"></div><div class="calc-num" id="cn-${id}">0</div></div><div class="calc-grid">${B.map(([l,c])=>`<button class="cb ${c}" onclick="CalculatorApp.press('${id}','${l}')">${l}</button>`).join('')}</div></div>`;
  },
  init(id){WM.setData(id,{expr:'',input:'0',fresh:true});},
  press(id,key){
    const d=WM.getData(id);if(!d)return;
    const disp=document.getElementById('cn-'+id);const expr=document.getElementById('ce-'+id);
    if(key==='C'){d.expr='';d.input='0';d.fresh=true;}
    else if(key==='='){try{let e=d.expr+d.input;e=e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/e(?![0-9])/g,'Math.E');const r=Function('"use strict";return('+e+')')();d.expr=e+'=';d.input=isFinite(r)?String(parseFloat(r.toPrecision(12))):'Fehler';d.fresh=true;}catch{d.input='Fehler';d.fresh=true;}}
    else if(['sin','cos','tan','ln','√'].includes(key)){try{const v=parseFloat(d.input);const r=key==='sin'?Math.sin(v):key==='cos'?Math.cos(v):key==='tan'?Math.tan(v):key==='ln'?Math.log(v):Math.sqrt(v);d.expr=key+'('+d.input+')=';d.input=String(parseFloat(r.toPrecision(12)));d.fresh=true;}catch{d.input='Fehler';}}
    else if(key==='π'){d.input=String(Math.PI);d.fresh=false;}
    else if(key==='e'){d.input=String(Math.E);d.fresh=false;}
    else if(key==='±'){d.input=String(-parseFloat(d.input)||0);}
    else if(key==='%'){d.input=String(parseFloat(d.input)/100);}
    else if(['+','-','−','×','÷','(',')','+/-'].includes(key)){d.expr+=d.input+key;d.input='0';d.fresh=true;}
    else if(/^[0-9.]$/.test(key)){if(d.fresh||d.input==='0'&&key!=='.')d.input=key;else if(key==='.'&&d.input.includes('.')){}else d.input+=key;d.fresh=false;}
    disp.textContent=d.input.length>12?parseFloat(d.input).toExponential(5):d.input;
    expr.textContent=d.expr;
  }
};

const PaintApp = {
  id:'paint', title:'Paint', icon:'🎨', w:620, h:500,
  html(id){
    const colors=['#000000','#ffffff','#ff0000','#00cc00','#0055ff','#ffdd00','#ff8800','#cc00cc','#00cccc','#885500','#ff99aa','#aaffcc','#99ddff','#dddddd','#888888','#003399'];
    return `<div class="paint-wrap"><div class="paint-tools" id="pt-${id}">${[['✏️','pencil'],['⬜','rect'],['⭕','ellipse'],['➖','line'],['🧹','eraser'],['🪣','fill']].map(([i,t])=>`<div class="ptool${t==='pencil'?' act':''}" data-tool="${t}" onclick="PaintApp.setTool('${id}','${t}')">${i}</div>`).join('')}<div style="height:4px"></div><div style="font-size:9px;color:var(--text3)">Größe</div><input type="range" min="1" max="40" value="4" style="writing-mode:vertical-lr;height:80px;accent-color:#3a9de0;cursor:pointer" id="psize-${id}" oninput="PaintApp.setSize('${id}',this.value)"><div style="font-size:9px;color:var(--text3)" id="psz-${id}">4px</div></div><div class="paint-right"><div class="paint-colors"><div style="width:24px;height:24px;border-radius:4px;border:2px solid white;box-shadow:0 0 0 1px #888;flex-shrink:0" id="pcur-${id}"></div><div style="width:1px;height:24px;background:rgba(100,160,220,.4);margin:0 4px;flex-shrink:0"></div>${colors.map((c,i)=>`<div class="pcolor${i===0?' act':''}" style="background:${c}" onclick="PaintApp.setColor('${id}','${c}',this)"></div>`).join('')}<input type="color" value="#000000" style="width:24px;height:24px;border:1px solid rgba(100,165,225,.5);border-radius:4px;cursor:pointer;padding:1px" onchange="PaintApp.setColor('${id}',this.value,null)"><button class="tbut" onclick="PaintApp.clear('${id}')" style="margin-left:auto">🗑</button><button class="tbut" onclick="PaintApp.download('${id}')">⬇</button></div><div class="paint-canvas-wrap" id="pcw-${id}"><canvas id="pc-${id}"></canvas></div></div></div>`;
  },
  init(id){
    const canvas=document.getElementById('pc-'+id);const wrap=document.getElementById('pcw-'+id);
    const state={tool:'pencil',color:'#000000',size:4,drawing:false,sx:0,sy:0,snapshot:null};
    WM.setData(id,state);
    document.getElementById('pcur-'+id).style.background='#000000';
    const setup=()=>{const snap=canvas.toDataURL();canvas.width=Math.max(wrap.clientWidth-2,400);canvas.height=Math.max(wrap.clientHeight-2,300);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);if(snap&&snap!=='data:,'){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=snap;}};
    WM.setResize(id,()=>setTimeout(setup,50));
    setTimeout(setup,50);
    const gp=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    canvas.addEventListener('mousedown',e=>{const{x,y}=gp(e);state.drawing=true;state.sx=x;state.sy=y;state.snapshot=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);if(state.tool==='fill')PaintApp.floodFill(canvas,Math.round(x),Math.round(y),state.color);else{const ctx=canvas.getContext('2d');ctx.beginPath();ctx.moveTo(x,y);}});
    canvas.addEventListener('mousemove',e=>{if(!state.drawing)return;const{x,y}=gp(e);const ctx=canvas.getContext('2d');ctx.lineWidth=state.size;ctx.lineCap='round';ctx.lineJoin='round';if(state.tool==='pencil'){ctx.strokeStyle=state.color;ctx.lineTo(x,y);ctx.stroke();}else if(state.tool==='eraser'){ctx.strokeStyle='#fff';ctx.lineTo(x,y);ctx.stroke();}else{ctx.putImageData(state.snapshot,0,0);ctx.strokeStyle=state.color;ctx.fillStyle=state.color+'44';if(state.tool==='rect'){ctx.beginPath();ctx.rect(state.sx,state.sy,x-state.sx,y-state.sy);ctx.fill();ctx.stroke();}else if(state.tool==='ellipse'){ctx.beginPath();ctx.ellipse(state.sx+(x-state.sx)/2,state.sy+(y-state.sy)/2,Math.abs(x-state.sx)/2,Math.abs(y-state.sy)/2,0,0,Math.PI*2);ctx.fill();ctx.stroke();}else if(state.tool==='line'){ctx.beginPath();ctx.moveTo(state.sx,state.sy);ctx.lineTo(x,y);ctx.stroke();}}});
    canvas.addEventListener('mouseup',()=>{state.drawing=false;state.snapshot=null;});
    canvas.addEventListener('mouseleave',()=>{state.drawing=false;});
  },
  setTool(id,tool){const d=WM.getData(id);if(d)d.tool=tool;document.querySelectorAll(`#pt-${id} .ptool`).forEach(t=>t.classList.toggle('act',t.dataset.tool===tool));},
  setColor(id,color,el){const d=WM.getData(id);if(d)d.color=color;const cur=document.getElementById('pcur-'+id);if(cur)cur.style.background=color;if(el){document.querySelectorAll('.pcolor').forEach(x=>x.classList.remove('act'));el.classList.add('act');}},
  setSize(id,sz){const d=WM.getData(id);if(d)d.size=parseInt(sz);const l=document.getElementById('psz-'+id);if(l)l.textContent=sz+'px';},
  clear(id){const c=document.getElementById('pc-'+id);if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);},
  download(id){const c=document.getElementById('pc-'+id);if(!c)return;const a=document.createElement('a');a.href=c.toDataURL();a.download='bild.png';a.click();OS.notify('⬇️','Gespeichert','Bild heruntergeladen');},
  floodFill(canvas,sx,sy,fillColor){const ctx=canvas.getContext('2d');const id2=ctx.getImageData(0,0,canvas.width,canvas.height);const d=id2.data;const w=canvas.width,h=canvas.height;const idx=(x,y)=>(y*w+x)*4;const ti=idx(sx,sy);if(sx<0||sx>=w||sy<0||sy>=h)return;const tr=d[ti],tg=d[ti+1],tb=d[ti+2],ta=d[ti+3];const fc=parseInt(fillColor.slice(1),16);const fr=(fc>>16)&255,fg=(fc>>8)&255,fb=fc&255;if(tr===fr&&tg===fg&&tb===fb)return;const stack=[[sx,sy]];while(stack.length){const[cx,cy]=stack.pop();if(cx<0||cx>=w||cy<0||cy>=h)continue;const i=idx(cx,cy);if(d[i]!==tr||d[i+1]!==tg||d[i+2]!==tb||d[i+3]!==ta)continue;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);}ctx.putImageData(id2,0,0);}
};

  TRACKS:[{t:'Crystal Waters',a:'AeroSound',d:'3:48',tot:228,e:'🌊'},{t:'Blue Horizon',a:'SkyDrift',d:'4:12',tot:252,e:'☁️'},{t:'Morning Dew',a:'NatureBeats',d:'3:22',tot:202,e:'🌿'},{t:'Glass Ocean',a:'AeroSound',d:'5:01',tot:301,e:'💎'},{t:'Bubble Dreams',a:'WaterLily',d:'2:58',tot:178,e:'🫧'}],
  html(id){return `<div class="music-body"><div class="art" id="ma-${id}">🌊</div><div class="trk-title" id="mt-${id}">Crystal Waters</div><div class="trk-art" id="mar-${id}">AeroSound</div><div class="prog-bar" onclick="MusicApp.seek('${id}',event,this)"><div class="prog-fill" id="mp-${id}" style="width:0%"></div></div><div class="time-row"><span id="mct-${id}">0:00</span><span id="mtt-${id}">3:48</span></div><div class="ctrl-row"><div class="pc" onclick="MusicApp.prev('${id}')">⏮</div><div class="pc play" id="mpb-${id}" onclick="MusicApp.toggle('${id}')">▶</div><div class="pc" onclick="MusicApp.next('${id}')">⏭</div></div><div class="vol-row"><span>🔈</span><input type="range" min="0" max="100" value="75" style="width:100px;accent-color:#3a9de0"><span>🔊</span></div><div class="playlist">${MusicApp.TRACKS.map((tr,i)=>`<div class="pl-it${i===0?' now':''}" id="pl-${id}-${i}" onclick="MusicApp.load('${id}',${i})">${tr.e} <span style="flex:1">${tr.t}</span><span style="color:var(--text3);font-size:11px">${tr.d}</span></div>`).join('')}</div></div>`;},
  init(id){WM.setData(id,{idx:0,playing:false,progress:0});const t=setInterval(()=>MusicApp.tick(id),1000);WM.setCleanup(id,()=>clearInterval(t));},
  tick(id){const d=WM.getData(id);if(!d||!d.playing)return;const tr=this.TRACKS[d.idx];d.progress=Math.min(100,d.progress+100/tr.tot);const sec=Math.round(d.progress/100*tr.tot);const p=document.getElementById('mp-'+id);if(p)p.style.width=d.progress+'%';const ct=document.getElementById('mct-'+id);if(ct)ct.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(d.progress>=100)this.next(id);},
  toggle(id){const d=WM.getData(id);if(!d)return;d.playing=!d.playing;const b=document.getElementById('mpb-'+id);if(b)b.textContent=d.playing?'⏸':'▶';},
  load(id,idx){const d=WM.getData(id);if(!d)return;const tr=this.TRACKS[idx];d.idx=idx;d.progress=0;d.playing=true;['ma','mt','mar','mtt','mpb'].forEach(k=>{const el=document.getElementById(k.replace('ma','ma').split('').join('')+'-'+id);});document.getElementById('ma-'+id).textContent=tr.e;document.getElementById('mt-'+id).textContent=tr.t;document.getElementById('mar-'+id).textContent=tr.a;document.getElementById('mtt-'+id).textContent=tr.d;document.getElementById('mpb-'+id).textContent='⏸';document.getElementById('mp-'+id).style.width='0%';document.querySelectorAll(`[id^="pl-${id}-"]`).forEach((el,i)=>el.classList.toggle('now',i===idx));},
  next(id){const d=WM.getData(id);if(!d)return;this.load(id,(d.idx+1)%this.TRACKS.length);},
  prev(id){const d=WM.getData(id);if(!d)return;this.load(id,(d.idx+this.TRACKS.length-1)%this.TRACKS.length);},
  seek(id,e,bar){const d=WM.getData(id);if(!d)return;const r=bar.getBoundingClientRect();d.progress=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));document.getElementById('mp-'+id).style.width=d.progress+'%';}
};

const CalendarApp = {
  id:'calendar', title:'Kalender', icon:'📅', w:360, h:440,
  html(id){return `<div class="cal-body"><div class="cal-header"><button class="cal-nav" onclick="CalendarApp.nav('${id}',-1)">◀</button><div class="cal-title" id="cal-title-${id}"></div><button class="cal-nav" onclick="CalendarApp.nav('${id}',1)">▶</button></div><div class="cal-grid" id="cg-${id}"></div><div class="cal-events" id="ce-${id}"></div></div>`;},
  init(id){const n=new Date();WM.setData(id,{y:n.getFullYear(),m:n.getMonth(),sel:null});this.render(id);},
  render(id){
    const d=WM.getData(id);if(!d)return;
    const{y,m}=d;const now=new Date();
    const months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    const days=['Mo','Di','Mi','Do','Fr','Sa','So'];
    document.getElementById('cal-title-'+id).textContent=`${months[m]} ${y}`;
    const grid=document.getElementById('cg-'+id);if(!grid)return;
    const first=(new Date(y,m,1).getDay()+6)%7;const dim=new Date(y,m+1,0).getDate();const prev=new Date(y,m,0).getDate();
    let html=days.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('');
    for(let i=0;i<first;i++)html+=`<div class="cal-cell other">${prev-first+1+i}</div>`;
    for(let i=1;i<=dim;i++){const isToday=i===now.getDate()&&m===now.getMonth()&&y===now.getFullYear();const isSel=d.sel===i;html+=`<div class="cal-cell${isToday?' today':''}${isSel?' sel':''}" onclick="CalendarApp.sel('${id}',${i})">${i}</div>`;}
    const rem=(7-((first+dim)%7))%7;for(let i=1;i<=rem;i++)html+=`<div class="cal-cell other">${i}</div>`;
    grid.innerHTML=html;
    const evs={1:['Neujahr 🎉'],3:['Meeting'],8:['Geburtstag 🎂'],15:['Review'],22:['Lunch 🍽️']};
    const evEl=document.getElementById('ce-'+id);if(!evEl)return;
    evEl.innerHTML='';
    if(d.sel&&evs[d.sel]){evs[d.sel].forEach(e=>evEl.innerHTML+=`<div class="cal-ev">${e}</div>`);}
    else{Object.entries(evs).forEach(([day,es])=>es.forEach(e=>evEl.innerHTML+=`<div class="cal-ev"><strong style="color:var(--accent)">${day}.</strong> ${e}</div>`));}
  },
  nav(id,dir){const d=WM.getData(id);if(!d)return;d.m+=dir;if(d.m>11){d.m=0;d.y++;}if(d.m<0){d.m=11;d.y--;}d.sel=null;this.render(id);},
  sel(id,day){const d=WM.getData(id);if(!d)return;d.sel=day;this.render(id);}
};

      for(let g=0;g<4;g++){ctx.beginPath();ctx.moveTo(0,h*(g/4));ctx.lineTo(w,h*(g/4));ctx.stroke();}
      ctx.beginPath();ctx.strokeStyle='#50d0ff';ctx.lineWidth=1.5;
      d.history.forEach((v,i)=>{const x=i*(w/60);const y=h-(v/100)*h;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
      ctx.stroke();
    }
    // RAM
    const ramPct=55+Math.random()*10;
    const ramMB=Math.round(ramPct*20.48);

    if(ramFree)ramFree.textContent=Math.round(2048-ramMB)+' MB';

    const up=Math.round(Math.random()*200);const dn=Math.round(Math.random()*800);
    const upEl=document.getElementById('smup-'+id);const dnEl=document.getElementById('smdn-'+id);

      }).join('');
    }
  }
};

const RecycleBin = {
  _items:[],
  delete(path){
    const content=VFS.read(path);
    const type=VFS.type(path);
    if(!VFS.exists(path))return false;
    this._items.unshift({path,content,type,name:path.split('/').pop(),deleted:new Date().toLocaleString('de-DE')});
    VFS.rm(path);
    return true;
  },
  restore(idx){
    const it=this._items[idx];if(!it)return;
    if(it.content!==null)VFS.write(it.path,it.content);
    else VFS.mkdir(it.path);
    this._items.splice(idx,1);
  },
  empty(){this._items=[];},
};

const RecycleBinApp = {
  id:'recyclebin', title:'Papierkorb', icon:'🗑️', w:420, h:380,
  html(id){return `
    <div class="toolbar">
      <button class="tbut" onclick="RecycleBinApp.restoreSel('${id}')">♻️ Wiederherstellen</button>
      <button class="tbut" onclick="RecycleBinApp.deleteSel('${id}')">🗑 Endgültig löschen</button>
      <div class="tsplit"></div>
      <button class="tbut" onclick="RecycleBinApp.empty('${id}')">🧹 Leeren</button>
    </div>
    <div class="rb-body" id="rb-${id}"></div>
    <div class="fm-status" id="rb-stat-${id}">0 Elemente</div>`;
  },
  init(id){WM.setData(id,{sel:-1});this.refresh(id);},
  refresh(id){
    const el=document.getElementById('rb-'+id);const st=document.getElementById('rb-stat-'+id);if(!el)return;
    const items=RecycleBin._items;
    if(items.length===0){el.innerHTML='<div class="rb-empty">🗑️<br>Papierkorb ist leer</div>';st.textContent='0 Elemente';return;}
    const imap={txt:'📄',js:'📜',css:'🎨',html:'🌐',json:'📊',md:'📖'};
    el.innerHTML=items.map((it,i)=>{
      const ext=it.name.split('.').pop().toLowerCase();
      const ico=it.type==='dir'?'📁':(imap[ext]||'📄');
      return `<div class="rb-item" id="rbi-${id}-${i}" onclick="RecycleBinApp.select('${id}',${i})">
        <span class="ri">${ico}</span>
        <div style="flex:1;overflow:hidden">
          <div class="rn">${it.name}</div>
          <div class="rp">${it.path}</div>
        </div>
        <div class="rd">${it.deleted}</div>
      </div>`;
    }).join('');
    st.textContent=`${items.length} Element${items.length!==1?'e':''}`;
  },
  select(id,idx){
    const d=WM.getData(id);if(!d)return;
    d.sel=idx;
    document.querySelectorAll(`#rb-${id} .rb-item`).forEach((el,i)=>el.classList.toggle('sel',i===idx));
  },
  restoreSel(id){
    const d=WM.getData(id);if(!d||d.sel<0)return;
    RecycleBin.restore(d.sel);d.sel=-1;
    this.refresh(id);OS.notify('♻️','Wiederhergestellt','Datei wurde wiederhergestellt');
  },
  deleteSel(id){
    const d=WM.getData(id);if(!d||d.sel<0)return;
    if(!confirm('Endgültig löschen?'))return;
    RecycleBin._items.splice(d.sel,1);d.sel=-1;
    this.refresh(id);
  },
  empty(id){
    if(!confirm('Papierkorb wirklich leeren?'))return;
    RecycleBin.empty();WM.getData(id).sel=-1;
    this.refresh(id);OS.notify('🗑️','Geleert','Papierkorb wurde geleert');
  }
};

const ClipboardApp = {
  id:'clipboard', title:'Zwischenablage', icon:'📌', w:340, h:400,
  _history:[],
  add(text){if(!text||text===this._history[0]?.text)return;this._history.unshift({text,time:new Date().toLocaleTimeString('de-DE'),id:Date.now()});if(this._history.length>50)this._history.pop();},
  html(id){return `
    <div class="toolbar">
      <button class="tbut" onclick="ClipboardApp.refresh('${id}')">↻ Aktualisieren</button>
      <button class="tbut" onclick="ClipboardApp.clearAll('${id}')">🗑 Alle löschen</button>
      <div style="margin-left:auto;font-size:11px;color:var(--text3)" id="cbc-${id}">0 Einträge</div>
    </div>
    <div class="cb-body" id="cbb-${id}"></div>`;
  },
  init(id){
    WM.setData(id,{});
    // Pre-populate with some items
    if(this._history.length===0){
      ['console.log("Hello AeroOS!");','background: linear-gradient(135deg, #3a9de0, #1a60b0);','Notiz: Wichtige Aufgabe erledigen','/home/user/Projects/hello-world/index.html'].forEach(t=>this.add(t));
    }
    this.refresh(id);
    // Poll clipboard
    const timer=setInterval(async()=>{
      try{const t=await navigator.clipboard.readText();if(t)ClipboardApp.add(t);ClipboardApp.refresh(id);}catch(e){}
    },2000);
    WM.setCleanup(id,()=>clearInterval(timer));
  },
  refresh(id){
    const el=document.getElementById('cbb-'+id);const cnt=document.getElementById('cbc-'+id);
    if(!el)return;
    if(cnt)cnt.textContent=this._history.length+' Einträge';
    el.innerHTML=this._history.map((it,i)=>`
      <div class="cb-item" onclick="ClipboardApp.paste('${id}',${i})">
        <span class="cdel" onclick="event.stopPropagation();ClipboardApp.del('${id}',${i})">✕</span>
        <div class="ct">${esc(it.text)}</div>
        <div class="cd">${it.time}</div>
      </div>`).join('');
  },
  paste(id,i){
    const it=this._history[i];if(!it)return;
    navigator.clipboard?.writeText(it.text).catch(()=>{});
    OS.notify('📌','Kopiert',it.text.slice(0,40)+(it.text.length>40?'…':''));
  },
  del(id,i){this._history.splice(i,1);this.refresh(id);},
  clearAll(id){this._history=[];this.refresh(id);},
};

          <textarea id="ccinput-${id}" placeholder="Schreib eine Nachricht…" rows="1" style="flex:1;padding:9px 12px;border-radius:12px;border:1px solid rgba(160,128,208,.3);background:rgba(255,255,255,.07);color:#e8d8ff;font-size:13px;outline:none;resize:none;line-height:1.5;max-height:120px;overflow-y:auto;-webkit-user-select:text;user-select:text;font-family:inherit" onkeydown="ClaudeApp.inputKey('${id}',event)" oninput="ClaudeApp.autoResize('${id}')"></textarea>
          <button id="ccsend-${id}" onclick="ClaudeApp.send('${id}')" style="width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,#a040e0,#7020c0);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(160,64,224,.4);transition:filter .1s" onmouseover="this.style.filter='brightness(1.15)'" onmouseout="this.style.filter=''">↑</button>

  },

  _controllers:{}, // just a cancelled-flag per id, no AbortSignal

  abortReq(id){
    this._controllers[id]=true; // signal the read loop to stop
    this._dblog(id,'⏹ Abbruch angefordert…','warn');
    this._dbstate(id,'Abbrechen…','#ffcc50');
  },
  _dblog(id, msg, type='info'){
    const log=document.getElementById('ccdblog-'+id);if(!log)return;
    const colors={info:'#50d0a0',warn:'#ffcc50',err:'#ff8888',recv:'#80b8ff',send:'#c097ff',ok:'#80ff80'};
    const now=new Date().toLocaleTimeString('de-DE',{hour12:false});
    const line=document.createElement('div');
    line.innerHTML=`<span style="color:#2a6040;user-select:none">[${now}]</span> <span style="color:${colors[type]||colors.info}">${msg}</span>`;
    log.appendChild(line);
    log.scrollTop=log.scrollHeight;
  },
  _dbstate(id, state, color='#50d0a0'){
    const el=document.getElementById('ccdbstate-'+id);
    if(el){el.textContent=state;el.style.background=`rgba(${color==='#50d0a0'?'80,208,160':color==='#ffcc50'?'255,200,80':color==='#ff8888'?'255,100,100':'80,180,255'},.15)`;el.style.color=color;}
  },
  toggleDebug(id){
    const p=document.getElementById('ccdebug-'+id);
    const btn=document.getElementById('ccdebugbtn-'+id);
    if(!p)return;
    const open=p.style.display==='none';
    p.style.display=open?'block':'none';
    if(btn)btn.style.background=open?'rgba(80,208,160,.15)':'';
    if(open)this._dblog(id,'Debug-Konsole geöffnet. Warte auf Anfragen…');
  },
  clearDebug(id){const l=document.getElementById('ccdblog-'+id);if(l)l.innerHTML='';},
  retryLast(id){
    const d=WM.getData(id);if(!d||!d.lastText||d.streaming)return;
    const ta=document.getElementById('ccinput-'+id);
    if(ta){ta.value=d.lastText;this.autoResize(id);ta.focus();}
    this._dblog(id,'↻ Letzte Nachricht in Eingabe geladen','warn');
    const retryBtn=document.getElementById('ccretry-'+id);
    if(retryBtn)retryBtn.style.display='none';
  },

  init(id){
    const key = localStorage.getItem('aeroos_claude_key')||'';
    WM.setData(id,{messages:[],key,streaming:false,keyVisible:false});
    // Pre-fill key display
    const keyEl=document.getElementById('ccshowkey-'+id);
    if(keyEl)keyEl.value=key;
    if(!key){
      document.getElementById('ccsetup-'+id).style.display='flex';
      document.getElementById('ccmsgs-'+id).style.display='none';
    } else {
      this._showWelcome(id);
    }
  },

  toggleKey(id){
    const panel=document.getElementById('cckeypanel-'+id);
    const chats=document.getElementById('ccchatspanel-'+id);
    if(!panel)return;
    const open=panel.style.display==='none';
    panel.style.display=open?'block':'none';
    if(open&&chats)chats.style.display='none';
    // Fill current key
    const d=WM.getData(id);
    const keyEl=document.getElementById('ccshowkey-'+id);
    if(keyEl&&d)keyEl.value=d.key||'';
  },

  toggleKeyVis(id){
    const d=WM.getData(id);if(!d)return;
    d.keyVisible=!d.keyVisible;
    const keyEl=document.getElementById('ccshowkey-'+id);
    const btn=document.getElementById('cceyebtn-'+id);
    if(keyEl)keyEl.type=d.keyVisible?'text':'password';
    if(btn)btn.textContent=d.keyVisible?'🙈 Verstecken':'👁 Zeigen';
  },

  copyKey(id){
    const d=WM.getData(id);if(!d||!d.key){OS.notify('❌','Kein Key','Noch kein API-Schlüssel gespeichert');return;}
    navigator.clipboard?.writeText(d.key).then(()=>OS.notify('📋','Kopiert','API-Schlüssel in Zwischenablage'))
      .catch(()=>{
        // Fallback: select the input
        const keyEl=document.getElementById('ccshowkey-'+id);
        if(keyEl){keyEl.type='text';keyEl.select();document.execCommand('copy');keyEl.type='password';}
        OS.notify('📋','Kopiert','API-Schlüssel kopiert');
      });
  },

  changeKey(id){
    const d=WM.getData(id);if(!d)return;
    const newKey=prompt('Neuen API-Schlüssel eingeben:',d.key||'');
    if(newKey===null)return;
    const trimmed=newKey.trim();
    if(!trimmed){OS.notify('❌','Fehler','Leerer Schlüssel');return;}
    localStorage.setItem('aeroos_claude_key',trimmed);
    d.key=trimmed;
    const keyEl=document.getElementById('ccshowkey-'+id);
    if(keyEl)keyEl.value=trimmed;
    // Hide setup, show chat
    document.getElementById('ccsetup-'+id).style.display='none';
    document.getElementById('ccmsgs-'+id).style.display='flex';
    OS.notify('🔑','Key aktualisiert','Neuer API-Schlüssel gespeichert');
  },

  toggleChats(id){
    const panel=document.getElementById('ccchatspanel-'+id);
    const keyPanel=document.getElementById('cckeypanel-'+id);
    if(!panel)return;
    const open=panel.style.display==='none';
    panel.style.display=open?'block':'none';
    if(open&&keyPanel)keyPanel.style.display='none';
    if(open)this._refreshChatList(id);
  },

  _refreshChatList(id){
    const list=document.getElementById('ccchatlist-'+id);if(!list)return;
    // Find all chat-*.txt files in Documents
    const docs=VFS.list('/home/user/Documents')||[];
    const chats=docs.filter(f=>f.type==='file'&&f.name.startsWith('chat-')&&f.name.endsWith('.txt'));
    if(chats.length===0){
      list.innerHTML='<div style="padding:8px 6px;font-size:11px;color:#5a4070">Noch keine gespeicherten Chats.<br>Klicke 💾 um den aktuellen Chat zu speichern.</div>';
      return;
    }
    list.innerHTML=chats.map((f,i)=>{
      const path='/home/user/Documents/'+f.name;
      // Parse date from filename: chat-2024-01-15-14-30.txt
      const label=f.name.replace('chat-','').replace('.txt','').replace(/-/g,':').replace(/(\d{4}:\d{2}:\d{2}):(\d{2}:\d{2})/,'$1 $2');
      return `<div style="display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer;transition:background .1s" onmouseover="this.style.background='rgba(160,128,208,.15)'" onmouseout="this.style.background=''" onclick="ClaudeApp._openSavedChat('${id}','${path}','${f.name}')">
        <span style="font-size:14px">💬</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:#c8a8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</div>
          <div style="font-size:10px;color:#5a4070">${f.size} Byte</div>
        </div>
        <button onclick="event.stopPropagation();ClaudeApp._deleteSavedChat('${id}','${path}')" style="font-size:11px;padding:2px 5px;border-radius:4px;border:none;background:transparent;color:#5a4070;cursor:pointer" onmouseover="this.style.color='#ff8888'" onmouseout="this.style.color='#5a4070'">✕</button>
        <button onclick="event.stopPropagation();OS.openApp('codeeditor',{file:'${path}',content:VFS.read('${path}')||''})" style="font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid rgba(160,128,208,.25);background:transparent;color:#a080d0;cursor:pointer">📝</button>
      </div>`;
    }).join('');
  },

  _openSavedChat(id,path,name){
    const content=VFS.read(path);if(!content)return;
    const d=WM.getData(id);if(!d)return;
    // Parse and reload messages
    const segments=content.split('\n\n---\n\n');
    const msgs=[];
    segments.forEach(seg=>{
      const m=seg.match(/^\[(USER|ASSISTANT)\]\n([\s\S]*)/);
      if(m)msgs.push({role:m[1].toLowerCase(),content:m[2].trim()});
    });
    d.messages=msgs;
    // Re-render
    const msgsEl=document.getElementById('ccmsgs-'+id);
    if(msgsEl){msgsEl.innerHTML='';msgs.forEach(m=>this._addMsg(id,m.role,m.content));}
    // Close panel
    document.getElementById('ccchatspanel-'+id).style.display='none';
    OS.notify('💬','Chat geladen',name);
  },

  _deleteSavedChat(id,path){
    if(!confirm('Chat löschen?'))return;
    RecycleBin.delete(path);
    this._refreshChatList(id);
    OS.notify('🗑️','Gelöscht','Chat in Papierkorb');
  },

  setKey(id){
    const inp=document.getElementById('ccapikey-'+id);
    const key=(inp?.value||'').trim();
    if(!key||!key.startsWith('sk-')){OS.notify('❌','Fehler','Ungültiger API-Schlüssel');return;}
    localStorage.setItem('aeroos_claude_key',key);
    const d=WM.getData(id);if(d)d.key=key;
    document.getElementById('ccsetup-'+id).style.display='none';
    document.getElementById('ccmsgs-'+id).style.display='flex';
    this._showWelcome(id);
    OS.notify('🔑','Claude','API-Schlüssel gespeichert!');
  },

  _showWelcome(id){
    this._addMsg(id,'assistant',`Hallo! Ich bin **Claude**, dein KI-Assistent direkt in AeroOS. 🌊\n\nIch kann dir helfen mit:\n- Code schreiben und erklären\n- Fragen beantworten\n- Texte schreiben oder überarbeiten\n- Mathematik und Logik\n- Und vielem mehr!\n\nWas kann ich für dich tun?`);
  },

  _addMsg(id, role, content){
    const msgs=document.getElementById('ccmsgs-'+id);if(!msgs)return;
    const isUser=role==='user';
    const div=document.createElement('div');
    div.style.cssText=`display:flex;gap:8px;align-items:flex-start;${isUser?'flex-direction:row-reverse':''}`;

    const avatar=document.createElement('div');
    avatar.style.cssText=`width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;${isUser?'background:linear-gradient(135deg,#3a9de0,#1a60b0)':'background:linear-gradient(135deg,#c97cf8,#a040e0)'}`;
    avatar.textContent=isUser?'👤':'🤖';

    const bubble=document.createElement('div');
    bubble.className='sel';
    const maxW=isUser?'75%':'88%';
    bubble.style.cssText=`max-width:${maxW};padding:10px 13px;border-radius:${isUser?'16px 4px 16px 16px':'4px 16px 16px 16px'};font-size:13px;line-height:1.65;${isUser?'background:linear-gradient(135deg,rgba(58,157,224,.35),rgba(26,96,176,.3));color:#c8e8ff;border:1px solid rgba(58,157,224,.3)':'background:rgba(255,255,255,.06);color:#e8d8ff;border:1px solid rgba(160,128,208,.2)'}`;

    // Render markdown-lite
    bubble.innerHTML=this._renderMd(content);
    div.appendChild(avatar);div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop=msgs.scrollHeight;
    return bubble;
  },

  // Global counter so each code block gets a unique ID
  _blockCounter:0,
  // Raw code store: blockId -> {lang, code}
  _rawBlocks:{},

  _renderMd(text, msgId){
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const preStyle=`background:rgba(0,0,0,.55);border:1px solid rgba(160,128,208,.2);border-radius:0 8px 8px 8px;padding:10px 12px;overflow-x:auto;font-family:Consolas,monospace;font-size:11px;color:#c8e8ff;margin:0;white-space:pre;-webkit-user-select:text;user-select:text`;
    const hdrBase=`background:rgba(160,128,208,.18);border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;padding:3px 8px;`;

    const blocks=[];
    const placeholder=i=>`\x00CB${i}\x00`;

    // Complete code blocks
    text=text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
      const label=lang.trim()||'text';
      const bid='cb'+(++this._blockCounter);
      this._rawBlocks[bid]={lang:label,code:code.trim()};
      const ext={js:'js',javascript:'js',ts:'ts',html:'html',css:'css',json:'json',python:'py',py:'py',sh:'sh',bash:'sh',md:'md',txt:'txt',java:'java',cpp:'cpp',c:'c',rust:'rs',go:'go'}[label.toLowerCase()]||'txt';
      const defName=`code-${bid}.${ext}`;
      const btnStyle=`padding:2px 8px;border-radius:4px;border:1px solid rgba(160,128,208,.3);background:rgba(255,255,255,.06);color:#a080d0;font-size:10px;cursor:pointer;white-space:nowrap;margin-left:auto`;
      const html=`<div style="margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid rgba(160,128,208,.2)">
        <div style="${hdrBase}">
          <span style="font-size:10px;color:#c097ff;font-weight:700">${esc(label)}</span>
          <span style="font-size:10px;color:#5a4070">${code.trim().split('\n').length} Zeilen · ${code.trim().length} Zeichen</span>
          <button style="${btnStyle}" onclick="ClaudeApp._copyBlock('${bid}')">📋 Kopieren</button>
          <button style="${btnStyle}" onclick="ClaudeApp._saveBlock('${bid}','${defName}')" title="Im VFS speichern">💾 Speichern</button>
          <button style="${btnStyle}" onclick="ClaudeApp._openBlock('${bid}','${defName}')" title="Im Code Editor öffnen">📝 Editor</button>
        </div>
        <pre style="${preStyle}">${esc(code.trim())}</pre>
      </div>`;
      blocks.push(html);
      return placeholder(blocks.length-1);
    });

    // Partial/streaming block
    text=text.replace(/```([^\n`]*)\n?([\s\S]*)$/,(_,lang,code)=>{
      const label=lang.trim()||'code';
      const html=`<div style="margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid rgba(160,128,208,.2)">
        <div style="${hdrBase}"><span style="font-size:10px;color:#c097ff;font-weight:700">${esc(label)}</span><span style="font-size:10px;color:#5a4070;animation:blink .7s step-end infinite">● schreibt…</span></div>
        <pre style="${preStyle}">${esc(code)}<span style="opacity:.4">▌</span></pre>
      </div>`;
      blocks.push(html);
      return placeholder(blocks.length-1);
    });

    text=esc(text);
    text=text.replace(/`([^`\n]+)`/g,`<code style="background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:11px;color:#c097ff;white-space:nowrap;-webkit-user-select:text;user-select:text">$1</code>`);
    text=text.replace(/\*\*([^*\n]+)\*\*/g,'<strong style="color:#fff">$1</strong>');
    text=text.replace(/\*([^*\n]+)\*/g,'<em style="color:#d0b8ff">$1</em>');
    text=text.replace(/^### (.+)$/gm,'<div style="font-size:13px;font-weight:700;color:#c097ff;margin:8px 0 4px">$1</div>');
    text=text.replace(/^## (.+)$/gm,'<div style="font-size:15px;font-weight:700;color:#c8a8ff;margin:10px 0 5px">$1</div>');
    text=text.replace(/^# (.+)$/gm,'<div style="font-size:17px;font-weight:700;color:#e8d8ff;margin:10px 0 6px">$1</div>');
    text=text.replace(/^- (.+)$/gm,'<div style="display:flex;gap:6px;margin:2px 0"><span style="color:#a040e0;flex-shrink:0;margin-top:1px">•</span><span>$1</span></div>');
    text=text.replace(/^(\d+)\. (.+)$/gm,'<div style="display:flex;gap:6px;margin:2px 0"><span style="color:#a040e0;flex-shrink:0;min-width:16px">$1.</span><span>$2</span></div>');
    text=text.replace(/\n/g,'<br>');
    blocks.forEach((html,i)=>{text=text.replace(esc(placeholder(i)),html);text=text.replace(placeholder(i),html);});
    return text;
  },

  _copyBlock(bid){
    const b=this._rawBlocks[bid];if(!b)return;
    navigator.clipboard?.writeText(b.code).then(()=>OS.notify('📋','Kopiert',`${b.lang} · ${b.code.length} Zeichen`))
      .catch(()=>{const ta=document.createElement('textarea');ta.value=b.code;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();OS.notify('📋','Kopiert','');});
  },

  _saveBlock(bid, defName){
    const b=this._rawBlocks[bid];if(!b)return;
    const path=prompt('Speichern unter:',`/home/user/Documents/${defName}`);
    if(!path)return;
    VFS.write(path,b.code);
    OS.notify('💾','Gespeichert',path.split('/').pop());
  },

  _openBlock(bid, defName){
    const b=this._rawBlocks[bid];if(!b)return;
    // Save to a temp path first, then open in editor
    const path=`/tmp/${defName}`;
    VFS.write(path,b.code);
    OS.openApp('codeeditor',{file:path,content:b.code});
  },

  // Collect ALL code blocks from the current chat and merge by language into files
  collectCode(id){
    const d=WM.getData(id);
    if(!d){OS.notify('❌','Fehler',`Kein State für ID: ${id}`);return;}
    if(!d.messages||d.messages.length===0){OS.notify('📦','Code sammeln','Chat ist leer — noch keine Nachrichten');return;}

    // Extract all code blocks from all assistant messages
    const allBlocks=[];
    d.messages.forEach((msg,mi)=>{
      if(msg.role!=='assistant')return;
      const re=/```([^\n`]*)\n?([\s\S]*?)```/g;
      let m;
      while((m=re.exec(msg.content))!==null){
        const lang=(m[1].trim()||'text').toLowerCase();
        const code=m[2].trim();
        if(code.length<3)continue;
        allBlocks.push({lang,code,msgIdx:mi});
      }
    });

    // Debug: how many assistant messages, how many blocks found
    const assistantMsgs=d.messages.filter(m=>m.role==='assistant').length;
    this._dblog(id,`📦 collectCode: ${d.messages.length} Nachrichten (${assistantMsgs} Assistant), ${allBlocks.length} Code-Blöcke gefunden`,'info');

    if(allBlocks.length===0){
      OS.notify('📦','Keine Blöcke',`${assistantMsgs} Antworten durchsucht — kein \`\`\`code\`\`\` gefunden`);
      return;
    }

    // Group by language
    const byLang={};
    allBlocks.forEach(b=>{
      if(!byLang[b.lang])byLang[b.lang]=[];
      byLang[b.lang].push(b);
    });

    // Build the collector window content
    const extMap={js:'js',javascript:'js',ts:'ts',typescript:'ts',html:'html',css:'css',json:'json',python:'py',py:'py',sh:'sh',bash:'sh',md:'md',java:'java',cpp:'cpp',c:'c',rust:'rs',go:'go'};
    let html=`<div style="flex:1;overflow-y:auto;padding:12px;background:rgba(4,10,28,.98);-webkit-user-select:text;user-select:text">
      <div style="font-size:13px;font-weight:700;color:#c8a8ff;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        📦 Code sammeln
        <span style="font-size:11px;color:#5a4070;font-weight:400">${allBlocks.length} Blöcke in ${Object.keys(byLang).length} Sprache(n)</span>
        <button onclick="ClaudeApp._saveAllCollected('${id}')" style="margin-left:auto;padding:4px 12px;border-radius:6px;border:none;background:linear-gradient(135deg,#a040e0,#7020c0);color:#fff;font-size:11px;cursor:pointer">💾 Alle speichern</button>
      </div>`;

    Object.entries(byLang).forEach(([lang,blocks])=>{
      const ext=extMap[lang]||'txt';
      const merged=blocks.map((b,i)=>blocks.length>1?`/* ── Block ${i+1} von Nachricht ${b.msgIdx+1} ── */\n${b.code}`:`${b.code}`).join('\n\n');
      const bid='collect_'+lang+'_'+id;
      this._rawBlocks[bid]={lang,code:merged};
      const defName=`code-${lang}.${ext}`;
      html+=`<div style="margin-bottom:14px;border:1px solid rgba(160,128,208,.2);border-radius:8px;overflow:hidden">
        <div style="background:rgba(160,128,208,.15);padding:5px 10px;display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;font-weight:700;color:#c097ff">${lang}</span>
          <span style="font-size:10px;color:#5a4070">${blocks.length} Block${blocks.length>1?'e':''} · ${merged.length} Zeichen · ${merged.split('\n').length} Zeilen</span>
          <button onclick="ClaudeApp._copyBlock('${bid}')" style="margin-left:auto;padding:2px 8px;border-radius:4px;border:1px solid rgba(160,128,208,.3);background:rgba(255,255,255,.06);color:#a080d0;font-size:10px;cursor:pointer">📋 Kopieren</button>
          <button onclick="ClaudeApp._saveBlock('${bid}','${defName}')" style="padding:2px 8px;border-radius:4px;border:1px solid rgba(160,128,208,.3);background:rgba(255,255,255,.06);color:#a080d0;font-size:10px;cursor:pointer">💾 Speichern</button>
          <button onclick="ClaudeApp._openBlock('${bid}','${defName}')" style="padding:2px 8px;border-radius:4px;border:1px solid rgba(160,128,208,.3);background:rgba(255,255,255,.06);color:#a080d0;font-size:10px;cursor:pointer">📝 Editor</button>
        </div>
        <pre style="background:rgba(0,0,0,.5);padding:10px 12px;font-family:Consolas,monospace;font-size:11px;color:#c8e8ff;overflow-x:auto;white-space:pre;margin:0;max-height:200px;overflow-y:auto;-webkit-user-select:text;user-select:text">${merged.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
        ${blocks.length>1?`<div style="padding:4px 10px;font-size:10px;color:#5a4070;background:rgba(0,0,0,.3)">⚠️ ${blocks.length} Blöcke wurden zusammengeführt — prüfe ob die Reihenfolge stimmt</div>`:''}
      </div>`;
    });
    html+='</div>';

    // Open in a new window
    WM.open({
      id:'codecollector',title:`📦 Code sammeln (${allBlocks.length} Blöcke)`,icon:'📦',w:580,h:500,
      html:()=>html,
      init:()=>{}
    });
  },

  _saveAllCollected(chatId){
    const d=WM.getData(chatId);if(!d)return;
    const extMap={js:'js',javascript:'js',ts:'ts',html:'html',css:'css',json:'json',python:'py',py:'py',sh:'sh',bash:'sh',md:'md',java:'java',cpp:'cpp',c:'c',rust:'rs',go:'go'};
    let saved=0;
    // Re-extract all blocks
    const byLang={};
    d.messages.forEach((msg,mi)=>{
      if(msg.role!=='assistant')return;
      const re=/```([^\n`]*)\n?([\s\S]*?)```/g;
      let m;
      while((m=re.exec(msg.content))!==null){
        const lang=(m[1].trim()||'text').toLowerCase();
        const code=m[2].trim();
        if(code.length<3)continue;
        if(!byLang[lang])byLang[lang]=[];
        byLang[lang].push(code);
      }
    });
    Object.entries(byLang).forEach(([lang,codes])=>{
      const ext=extMap[lang]||'txt';
      const merged=codes.length>1?codes.map((c,i)=>`/* ── Block ${i+1} ── */\n${c}`).join('\n\n'):codes[0];
      const path=`/home/user/Documents/code-${lang}.${ext}`;
      VFS.write(path,merged);saved++;
    });
    OS.notify('💾','Alle gespeichert',`${saved} Datei(en) in /home/user/Documents/`);
  },

  autoResize(id){
    const ta=document.getElementById('ccinput-'+id);if(!ta)return;
    ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  },

  inputKey(id,e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.send(id);}
  },

  async send(id){
    const d=WM.getData(id);if(!d||d.streaming)return;
    const ta=document.getElementById('ccinput-'+id);
    const text=(ta?.value||'').trim();
    if(!text)return;

    if(!d.key){
      document.getElementById('ccsetup-'+id).style.display='flex';
      document.getElementById('ccmsgs-'+id).style.display='none';
      return;
    }

    ta.value='';ta.style.height='auto';
    d.lastText=text;
    d.messages.push({role:'user',content:text});
    this._addMsg(id,'user',text);

    d.streaming=true;
    this._controllers[id]=false; // false = not cancelled
    const startMs=Date.now();

    const sendBtn=document.getElementById('ccsend-'+id);
    const statusEl=document.getElementById('ccstatus-'+id);
    const typingEl=document.getElementById('cctyping-'+id);
    const abortBtn=document.getElementById('ccabort-'+id);
    const retryBtn=document.getElementById('ccretry-'+id);
    const dbTimeEl=document.getElementById('ccdbtime-'+id);

    if(sendBtn){sendBtn.innerHTML='⏹';sendBtn.onclick=()=>ClaudeApp.abortReq(id);}
    if(typingEl)typingEl.style.display='flex';
    if(abortBtn)abortBtn.style.display='';
    if(retryBtn)retryBtn.style.display='none';

    this._dbstate(id,'Verbinde…','#80b8ff');
    this._dblog(id,`→ Sende | ${d.messages.length} Nachrichten | "${text.slice(0,60)}${text.length>60?'…':''}"`, 'send');

    const timerInterval=setInterval(()=>{
      const s=((Date.now()-startMs)/1000).toFixed(1);
      if(dbTimeEl)dbTimeEl.textContent=s+'s';
      if(statusEl&&d.streaming)statusEl.textContent=`Schreibt… ${tokenCount} Zeichen · ${s}s`;
    },200);

    const bubble=this._addMsg(id,'assistant','');
    bubble.innerHTML=`<span style="display:inline-flex;gap:3px;align-items:center;height:18px">
      <span style="width:7px;height:7px;border-radius:50%;background:#a040e0;animation:blink 1s ease-in-out infinite"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:#a040e0;animation:blink 1s ease-in-out .33s infinite"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:#a040e0;animation:blink 1s ease-in-out .66s infinite"></span>
    </span>`;

    let fullText='',tokenCount=0;

    // During streaming: show raw text in a plain pre — zero regex, no DOM thrashing
    // We use a textarea-like pre so it scrolls naturally
    const streamPre=document.createElement('pre');
    streamPre.className='sel';
    streamPre.style.cssText='font:13px/1.65 inherit;white-space:pre-wrap;word-break:break-word;margin:0;color:inherit';
    bubble.innerHTML='';
    bubble.appendChild(streamPre);

    // Throttle DOM text update to every 60ms
    let lastRender=0,rafPending=false;
    const renderStream=()=>{
      if(rafPending)return;
      const now=Date.now();
      if(now-lastRender<60)return;
      rafPending=true;
      requestAnimationFrame(()=>{
        streamPre.textContent=fullText;
        const msgs=document.getElementById('ccmsgs-'+id);
        if(msgs)msgs.scrollTop=msgs.scrollHeight;
        lastRender=Date.now();
        rafPending=false;
      });
    };

    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key':d.key,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true',
        },
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:4096,
          system:'Du bist Claude, ein KI-Assistent eingebettet in AeroOS — ein Frutiger-Aero-themed Browser-Betriebssystem. Antworte hilfreich und auf Deutsch wenn der Nutzer Deutsch schreibt. Formatiere Antworten mit Markdown.',
          stream:true,
          messages:d.messages,
        }),
      });

      this._dblog(id,`← HTTP ${resp.status} ${resp.statusText} (${((Date.now()-startMs)/1000).toFixed(2)}s)`, resp.ok?'ok':'err');

      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        const msg=errData?.error?.message||'HTTP '+resp.status;
        this._dblog(id,`  Fehlerdetails: ${JSON.stringify(errData).slice(0,200)}`,'err');
        throw new Error(msg);
      }

      this._dbstate(id,'Empfange…','#80b8ff');
      const reader=resp.body.getReader();
      const decoder=new TextDecoder();
      let buf='',chunkCount=0;

      // Cancel-poll: kicks reader.cancel() when abort flag is set
      const cancelPoll=setInterval(()=>{
        if(this._controllers[id]){reader.cancel();clearInterval(cancelPoll);}
      },100);

      try{
        while(true){
          const{done,value}=await reader.read();
          if(done){this._dblog(id,`  Stream Ende — ${chunkCount} Chunks, ${tokenCount} Zeichen`,'ok');break;}
          if(this._controllers[id]){this._dblog(id,'  Abgebrochen','warn');break;}
          chunkCount++;
          buf+=decoder.decode(value,{stream:true});
          const lines=buf.split('\n');buf=lines.pop()||'';
          for(const line of lines){
            if(!line.startsWith('data: '))continue;
            const data=line.slice(6).trim();
            if(data==='[DONE]')break;
            try{
              const evt=JSON.parse(data);
              if(evt.type==='message_start')this._dblog(id,`  input_tokens: ${evt.message?.usage?.input_tokens??'?'}`,'recv');
              if(evt.type==='message_delta'&&evt.usage)this._dblog(id,`  output_tokens: ${evt.usage.output_tokens}`,'recv');
              if(evt.type==='content_block_delta'&&evt.delta?.type==='text_delta'){
                fullText+=evt.delta.text;
                tokenCount=fullText.length;
                renderStream();
              }
            }catch(e){this._dblog(id,`  Parse-Fehler: ${e.message}`,'warn');}
          }
        }
      }finally{clearInterval(cancelPoll);}

      // Stream done — now do the one-time full markdown render
      const wasCancelled=!!this._controllers[id];
      const finalText=fullText||(wasCancelled?'_(abgebrochen)_':'');
      bubble.innerHTML=this._renderMd(finalText);
      const msgs2=document.getElementById('ccmsgs-'+id);
      if(msgs2)msgs2.scrollTop=msgs2.scrollHeight;

      if(wasCancelled){
        this._dbstate(id,'Abgebrochen','#ffcc50');
        this._dblog(id,`⏹ Abgebrochen nach ${tokenCount} Zeichen`,'warn');
        if(fullText) d.messages.push({role:'assistant',content:fullText});
        else d.messages.pop();
      } else {
        d.messages.push({role:'assistant',content:fullText});
        const elapsed=((Date.now()-startMs)/1000).toFixed(2);
        this._dbstate(id,'Fertig ✓','#80ff80');
        this._dblog(id,`✓ Fertig — ${tokenCount} Zeichen in ${elapsed}s`,'ok');
      }

    }catch(err){
      const errMsg=String(err.message||err);
      bubble.innerHTML=`<div style="color:#ff8888;display:flex;gap:8px;align-items:flex-start">
        <span>⚠️</span>
        <div><strong>Fehler</strong><br><span style="-webkit-user-select:text;user-select:text">${errMsg}</span>
        <br><button onclick="ClaudeApp.retryLast('${id}')" style="margin-top:6px;padding:3px 10px;border-radius:4px;border:1px solid rgba(255,200,80,.4);background:rgba(255,180,50,.1);color:#ffcc50;font-size:11px;cursor:pointer">↻ Erneut versuchen</button>
        </div></div>`;
      this._dbstate(id,'Fehler ✗','#ff8888');
      this._dblog(id,`✗ ${errMsg}`,'err');
      d.messages.pop();
      if(retryBtn)retryBtn.style.display='';
      if(errMsg.includes('401')||errMsg.includes('invalid x-api-key')){
        localStorage.removeItem('aeroos_claude_key');d.key='';
        this._dblog(id,'  Key ungültig — gelöscht','err');
        setTimeout(()=>{document.getElementById('ccsetup-'+id).style.display='flex';document.getElementById('ccmsgs-'+id).style.display='none';},1800);
      }
    }finally{
      clearInterval(timerInterval);
      d.streaming=false;delete this._controllers[id];
      if(sendBtn){sendBtn.innerHTML='↑';sendBtn.onclick=()=>ClaudeApp.send(id);}
      if(typingEl)typingEl.style.display='none';
      if(abortBtn)abortBtn.style.display='none';
      if(statusEl)statusEl.textContent=`Bereit · ${tokenCount} Zeichen · claude-sonnet-4-20250514`;
      if(dbTimeEl)dbTimeEl.textContent='';
      const msgs=document.getElementById('ccmsgs-'+id);
      if(msgs)msgs.scrollTop=msgs.scrollHeight;
      ta.focus();
    }
  },

  clearChat(id){
    const d=WM.getData(id);if(!d)return;
    d.messages=[];
    const msgs=document.getElementById('ccmsgs-'+id);
    if(msgs)msgs.innerHTML='';
    this._showWelcome(id);
  },

  saveChat(id){
    const d=WM.getData(id);if(!d||!d.messages.length)return;
    const txt=d.messages.map(m=>`[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n---\n\n');
    const ts=new Date().toISOString().slice(0,16).replace('T','-').replace(':','-');
    VFS.write(`/home/user/Documents/chat-${ts}.txt`,txt);
    OS.notify('💾','Gespeichert',`chat-${ts}.txt`);
  }
};

// ══════════════════════════════════════════
//  REGISTRY + OS CORE
// ══════════════════════════════════════════
// ══════════════════════════════════════════
//  DEBUG CONSOLE
// ══════════════════════════════════════════
const Debug = {
  _logs: [],
  _maxLogs: 500,
  _listeners: new Set(),

  log(type, ...args) {
    const entry = {
      t: Date.now(),
      type, // 'log','warn','error','info','api','net','stream'
      msg: args.map(a => {
        try { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); }
        catch(e) { return String(a); }
      }).join(' ')
    };
    this._logs.push(entry);
    if (this._logs.length > this._maxLogs) this._logs.shift();
    this._listeners.forEach(fn => fn(entry));
  },
  info(...a)   { this.log('info',   ...a); },
  warn(...a)   { this.log('warn',   ...a); },
  error(...a)  { this.log('error',  ...a); },
  api(...a)    { this.log('api',    ...a); },
  net(...a)    { this.log('net',    ...a); },
  stream(...a) { this.log('stream', ...a); },

  subscribe(fn)   { this._listeners.add(fn); },
  unsubscribe(fn) { this._listeners.delete(fn); },
  clear()         { this._logs = []; this._listeners.forEach(fn => fn(null)); },
};

// Intercept console
const _origConsole = { log: console.log, warn: console.warn, error: console.error };
console.log   = (...a) => { _origConsole.log(...a);   Debug.log('log',   ...a); };
console.warn  = (...a) => { _origConsole.warn(...a);  Debug.log('warn',  ...a); };
console.error = (...a) => { _origConsole.error(...a); Debug.log('error', ...a); };

// Intercept unhandled errors
window.addEventListener('error', e => Debug.error(`❌ ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', e => Debug.error(`❌ Unhandled Promise: ${e.reason}`));

const DebugApp = {
  id:'debug', title:'Debug Console', icon:'🐛', w:660, h:500,

  html(id) {
    return `<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0a0f1a;font-family:Consolas,'Courier New',monospace">

        </div>
      </div>
    </div>`;
  },

  init(id) {
    const state = { filter: {log:true,warn:true,error:true,api:true,stream:true,net:true,info:true}, search:'', replHistory:[], replIdx:-1 };
    WM.setData(id, state);

    // Render existing logs
    this.refilter(id);

    // Subscribe to new logs
    const listener = (entry) => {
      if (!entry) { this.refilter(id); return; } // clear
      const d = WM.getData(id); if (!d) return;
      if (!d.filter[entry.type]) return;
      if (d.search && !entry.msg.toLowerCase().includes(d.search.toLowerCase())) return;
      this._appendEntry(id, entry);
      this._updateCount(id);
    };
    Debug.subscribe(listener);
    WM.setCleanup(id, () => Debug.unsubscribe(listener));

    Debug.info('🐛 Debug Console geöffnet');
    Debug.info(`📊 ${Debug._logs.length} Einträge im Verlauf`);
  },

  _colors: { log:'#8ab8d8', warn:'#ffdd88', error:'#ff7070', api:'#70d0ff', stream:'#50ffcc', net:'#a0c8ff', info:'#a0a8b8' },
  _icons:  { log:'·', warn:'⚠', error:'✕', api:'🤖', stream:'▸', net:'🌐', info:'ℹ' },

  _appendEntry(id, entry) {
    const out = document.getElementById('dbout-'+id); if(!out) return;
    const color = this._colors[entry.type] || '#8ab8d8';
    const icon  = this._icons[entry.type]  || '·';
    const time  = new Date(entry.t).toTimeString().slice(0,8);
    const row = document.createElement('div');
    row.dataset.type = entry.type;
    row.dataset.msg  = entry.msg.toLowerCase();
    row.style.cssText = `padding:2px 10px;font-size:11px;line-height:1.6;border-bottom:1px solid rgba(255,255,255,.025);white-space:pre-wrap;word-break:break-all;color:${color}`;
    // Truncate very long messages
    const display = entry.msg.length > 2000 ? entry.msg.slice(0,2000)+'…[gekürzt]' : entry.msg;
    row.innerHTML = `<span style="color:#2a5070;user-select:none">${time} </span><span style="color:${color};opacity:.6;user-select:none">${icon} </span>${this._escHtml(display)}`;
    out.appendChild(row);
    // Auto-scroll
    const autoScroll = document.getElementById('dbautoscroll-'+id);
    if (autoScroll?.checked) out.scrollTop = out.scrollHeight;
  },

  _escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); },

  refilter(id) {
    const d = WM.getData(id); if(!d) return;
    // Read checkboxes
    ['log','warn','error','api','stream','net','info'].forEach(t => {
      const cb = document.getElementById(`dbfilter-${t}-${id}`);
      if(cb) d.filter[t] = cb.checked;
    });
    const searchEl = document.getElementById('dbsearch-'+id);
    d.search = searchEl?.value?.toLowerCase() || '';

    const out = document.getElementById('dbout-'+id); if(!out) return;
    out.innerHTML = '';
    Debug._logs.forEach(e => {
      if (!d.filter[e.type]) return;
      if (d.search && !e.msg.toLowerCase().includes(d.search)) return;
      this._appendEntry(id, e);
    });
    this._updateCount(id);
  },

  _updateCount(id) {
    const out = document.getElementById('dbout-'+id);
    const cnt = document.getElementById('dbcount-'+id);
    if(cnt && out) cnt.textContent = `${out.children.length} / ${Debug._logs.length}`;
  },

  clear(id) { Debug.clear(); },

  replKey(id, e) {
    const d = WM.getData(id); if(!d) return;
    const inp = document.getElementById('dbrepl-'+id); if(!inp) return;
    if(e.key === 'Enter') {
      const code = inp.value.trim(); if(!code) return;
      d.replHistory.unshift(code); d.replIdx = -1;
      inp.value = '';
      Debug.log('log', `❯ ${code}`);
      try {
        // Evaluate in OS context (has access to VFS, WM, OS, etc)
        const result = (new Function(
          'VFS','WM','OS','REGISTRY','Debug','ClaudeApp','BrowserApp',
          `"use strict"; return (${code})`
        ))(VFS, WM, OS, REGISTRY, Debug, ClaudeApp, BrowserApp);
        if (result !== undefined) {
          const str = typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result);
          Debug.info(`← ${str}`);
        } else {
          Debug.info('← undefined');
        }
      } catch(err) {
        Debug.error(`← ${err.message}`);
      }
    } else if(e.key === 'ArrowUp') {
      e.preventDefault();
      d.replIdx = Math.min(d.replIdx+1, d.replHistory.length-1);
      if(d.replHistory[d.replIdx]) inp.value = d.replHistory[d.replIdx];
    } else if(e.key === 'ArrowDown') {
      e.preventDefault();
      d.replIdx = Math.max(d.replIdx-1, -1);
      inp.value = d.replIdx >= 0 ? d.replHistory[d.replIdx] : '';
    }
  },
};

  _neuroColor(word){
    const t=word.toLowerCase();
